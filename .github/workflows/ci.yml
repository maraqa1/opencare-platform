name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/portal/package.json

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(find install scripts -type f -name '*.sh' | sort)
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          shellcheck "${shell_files[@]}"

      - name: Install YAML validator
        run: python -m pip install --upgrade pip yamllint

      - name: Validate YAML files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t yaml_files < <(find manifests .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [ "${#yaml_files[@]}" -eq 0 ]; then
            echo "No YAML files found"
            exit 0
          fi
          yamllint -d "{extends: default, rules: {line-length: {max: 160}, truthy: disable, comments: disable}}" "${yaml_files[@]}"

      - name: Install backend dependencies
        run: python -m pip install -r apps/backend/requirements.txt

      - name: Validate dbt project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f dbt/opencare/dbt_project.yml
          test -f dbt/opencare/profiles.template.yml
          test -f dbt/opencare/models/sources.yml
          test -f dbt/opencare/models/schema.yml
          test -f dbt/opencare/models/staging/stg_bed_events.sql
          test -f dbt/opencare/models/staging/stg_departments.sql
          test -f dbt/opencare/models/marts/fact_bed_occupancy.sql
          test -f dbt/opencare/models/marts/fact_capacity.sql
          test -f dbt/opencare/models/marts/dim_department.sql
          test -f dbt/opencare/models/marts/dim_time.sql

      - name: Install portal dependencies
        working-directory: apps/portal
        run: npm install

      - name: Build portal
        working-directory: apps/portal
        env:
          BACKEND_URL: http://backend:8000
          NEXT_PUBLIC_API_BASE_URL: http://backend:8000
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: ./apps/backend/Dockerfile
            image_repo: ghcr.io/maraqa1/opencare-backend
          - name: portal
            context: ./apps/portal
            dockerfile: ./apps/portal/Dockerfile
            image_repo: ghcr.io/maraqa1/opencare-portal
          - name: superset
            context: .
            dockerfile: ./superset/Dockerfile
            image_repo: ghcr.io/maraqa1/opencare-superset
          - name: runtime-bed-forecast
            context: ./r-runtime/bed-forecast
            dockerfile: ./r-runtime/bed-forecast/Dockerfile
            image_repo: ghcr.io/maraqa1/opencare-runtime-bed-forecast
            runtime_image: true
          - name: runtime-anomaly
            context: ./r-runtime/anomaly
            dockerfile: ./r-runtime/anomaly/Dockerfile
            image_repo: ghcr.io/maraqa1/opencare-runtime-anomaly
            runtime_image: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          tags="${{ matrix.image_repo }}:latest"

          if [[ "${{ matrix.runtime_image || false }}" == "true" ]]; then
            tags="${{ matrix.image_repo }}:${GITHUB_SHA}"
            if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
              tags="${tags}"$'\n'"${{ matrix.image_repo }}:dev"
            fi
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          load: false
          tags: ${{ steps.image_tags.outputs.tags }}
