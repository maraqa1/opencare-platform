name: Deploy Jazan Demo Portal

on:
  push:
    branches:
      - codex/jazan-demo
    paths:
      - "apps/portal/**"
      - "apps/ai-gateway/**"
      - "config/use_cases.yaml"
      - "manifests/portal/**"
      - "manifests/local-ai/**"
      - "scripts/jazan/**"
      - "scripts/local-ai/**"
      - ".github/workflows/jazan-demo-deploy.yml"
  workflow_dispatch:

concurrency:
  group: jazan-demo-portal-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy portal on Jazan VM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight VM SSH configuration
        id: preflight
        shell: bash
        env:
          JAZAN_VM_SSH_KEY: ${{ secrets.JAZAN_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${JAZAN_VM_SSH_KEY}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Jazan deploy skipped"
              echo ""
              echo "The workflow is installed, but the VM SSH secret is not configured yet."
              echo ""
              echo "Add repository secret \`JAZAN_VM_SSH_KEY\` with a private key that can SSH to the Jazan VM."
              echo ""
              echo "Optional secrets:"
              echo "- \`JAZAN_VM_HOST\` defaults to \`78.47.100.139\`"
              echo "- \`JAZAN_VM_USER\` defaults to \`root\`"
              echo "- \`JAZAN_VM_REPO_PATH\` defaults to \`/root/opencare-platform\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy on VM
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          JAZAN_VM_HOST: ${{ secrets.JAZAN_VM_HOST || '78.47.100.139' }}
          JAZAN_VM_USER: ${{ secrets.JAZAN_VM_USER || 'root' }}
          JAZAN_VM_SSH_KEY: ${{ secrets.JAZAN_VM_SSH_KEY }}
          JAZAN_VM_REPO_PATH: ${{ secrets.JAZAN_VM_REPO_PATH || '/root/opencare-platform' }}
        run: |
          set -euo pipefail

          deploy_portal=true
          if [[ "${{ github.event_name }}" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
            if ! grep -Eq '^(apps/portal/|manifests/portal/|config/use_cases\.yaml|scripts/jazan/deploy_portal_vm\.sh)$' <<<"${changed_files}"; then
              deploy_portal=false
            fi
          fi

          echo "Deploy portal: ${deploy_portal}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${JAZAN_VM_SSH_KEY}" > ~/.ssh/jazan_demo_deploy_key
          chmod 600 ~/.ssh/jazan_demo_deploy_key
          ssh -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -i ~/.ssh/jazan_demo_deploy_key \
            "${JAZAN_VM_USER}@${JAZAN_VM_HOST}" \
            "cd '${JAZAN_VM_REPO_PATH}' && git fetch origin codex/jazan-demo && git checkout codex/jazan-demo && git pull --ff-only origin codex/jazan-demo && if [[ '${deploy_portal}' == 'true' ]]; then bash scripts/jazan/deploy_portal_vm.sh; else echo 'Skipping portal rebuild for AI-only change'; fi && bash scripts/jazan/deploy_local_ai_vm.sh"
