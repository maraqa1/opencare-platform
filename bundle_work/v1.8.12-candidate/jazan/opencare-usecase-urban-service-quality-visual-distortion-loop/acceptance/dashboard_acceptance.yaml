kind: DashboardAcceptanceContract
use_case_slug: urban-service-quality-visual-distortion-loop
screen_acceptance:
- screen_id: SCREEN-L1-STRATEGIC
  must_answer:
  - Which KPIs or municipalities require attention?
  must_show:
  - strategic_objective_header
  - kpi_state_summary_strip
  - kpi_connector_rail
  - kpi_threshold_card_grid
  - highest_priority_case_alert
  must_bind_to:
  - analytics tables declared in data/output_tables.yaml
  - runtime outputs declared in runtime/images.yaml where applicable
  forbidden:
  - placeholder chart
  - sample payload
  - unguided mockup-only rendering
  - unbound route generic fallback
  required_drill_paths:
  - L1 to L2
  - L2 to L3 case
  - crosscut decisions/audit/runtimes
  required_governance_evidence:
  - classification
  - ownership
  - freshness
  - quality
  - lineage
  runtime_outputs_required: []
  platform_capabilities_required:
  - native_bi_charts
  - decision_workflow
  - runtime_evidence
- screen_id: SCREEN-L2-KPI
