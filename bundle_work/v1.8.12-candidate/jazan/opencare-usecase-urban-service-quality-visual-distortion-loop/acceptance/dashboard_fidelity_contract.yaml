- external_action_without_human_approval
- decision_dashboard_without_audit_event_contract
- KPI_connector_rail_missing
- threshold_rail_missing
- active_case_banner_missing
- Arabic_sublabels_missing_where_required
- component_anatomy_not_followed
- layout_zone_contract_ignored
- visual_grammar_contract_ignored
- case_decision_tab_contains_queue
- case_decision_tab_missing_bilingual_narrative
- case_decision_tab_missing_confirmation_modal
- case_decision_tab_hides_recovery_tab
- case_decision_tab_missing_audit_footnote
- case_model_intelligence_contains_authorisation_actions
- decision_action_name_alias_conflict
- legacy_kpi_case_route_shape_present
