kind: DashboardFidelityContract
use_case_slug: urban-service-quality-visual-distortion-loop
required_dashboard_count: 8
required_dashboard_ids:
- 01_strategic_objective_monitoring
- 02_kpi_municipality_workspace
- 03_case_model_intelligence
- 03_primary_case_decision_command_tab
- 04_outcome_recovery_feedback
- 04_decision_command_centre
- 05_runtime_evidence_execution_history
