- dashboard_route_missing
- dashboard_collapsed_into_generic_shell
- dashboard_id_substituted
- required_component_missing
- required_action_button_missing
- governance_evidence_missing
- runtime_evidence_missing
- mockup_traceability_missing
- screen_uses_unbound_static_values
