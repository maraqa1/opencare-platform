kind: RenderedDashboardConformance
use_case_slug: urban-service-quality-visual-distortion-loop
required: true
rule: A bundle is not accepted as implemented until rendered OpenCare routes conform to canonical dashboard contracts.
required_evidence:
- route_screenshot
- route_component_inventory
- action_button_inventory
- data_binding_inventory
- governance_panel_inventory
- runtime_evidence_inventory
- rendered_gap_register
conformance_levels:
  pass: All required dashboards, zones, components, bindings, actions, governance, and runtime evidence render.
  partial: Dashboard route renders but one or more required contract elements are missing.
  fail: Dashboard missing, collapsed, substituted, unbound, or non-interactive.
fail_conditions:
- dashboard_replaced_by_overview
- canonical_dashboard_route_missing
- required_component_absent
- action_button_absent_or_decorative
- runtime_evidence_not_rendered
- governance_evidence_not_rendered
- mockup_traceability_ignored
- case_decision_tab_replaced_by_queue
- case_decision_tab_external_action_without_confirmation
per_dashboard_evidence_required: true
dashboards:
