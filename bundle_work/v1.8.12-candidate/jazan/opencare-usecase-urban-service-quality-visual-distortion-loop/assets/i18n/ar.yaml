# NOTE: this is an initial draft requiring review by a native Arabic speaker
# familiar with MOMRAH and Emarah Diwan vocabulary before any customer-facing use.
# Government and municipal terminology in Saudi Arabia has specific institutional
# conventions; an automated translation is not acceptable for the final delivery.

# === Strategic objective ===
objective.name: 'استدامة وتحسين جودة الخدمات البلدية ومعالجة التشوه البصري'
objective.description: 'مخرج استراتيجي ضمن برنامج جودة الحياة لرؤية 2030 ومؤشر الأداء البلدي لوزارة الشؤون البلدية والقروية والإسكان، يغطي 25 بلدية في منطقة جازان.'

# === KPIs ===
kpi.1.name: 'جودة تنفيذ إغلاق بلاغات التشوه البصري'
kpi.1.short_name: 'التشوه البصري'
kpi.1.description: 'جودة التنفيذ عند إغلاق بلاغات التشوه البصري — توثيق الأدلة، الالتزام بمستوى الخدمة، واستدامة المعالجة.'
kpi.1.formula: '(البلاغات المغلقة بأدلة موثقة ضمن مستوى الخدمة) ÷ (إجمالي البلاغات المغلقة في الشهر)'
kpi.1.trigger_rule: 'المؤشر أقل من 0.75 لمدة أسبوعين أو احتمالية الإخلال المتوقعة أكبر من 0.70'

kpi.2.name: 'نسبة إغلاق طلبات الخدمات'
kpi.2.short_name: 'طلبات الخدمات'
kpi.2.description: 'النسبة المئوية لطلبات الخدمات المغلقة ضمن مستوى الخدمة، باستثناء الطلبات المرفوضة.'
kpi.2.formula: '(الطلبات المغلقة ضمن مستوى الخدمة) ÷ (إجمالي الطلبات المستلمة ناقص المرفوضة)'
kpi.2.trigger_rule: 'المؤشر أقل من 0.85 لمدة أسبوعين متتاليين'

kpi.3.name: 'متوسط زمن إصدار الرخص'
kpi.3.short_name: 'زمن الرخص'
kpi.3.description: 'متوسط أيام العمل من تقديم الرخصة إلى الموافقة، حسب فئة الرخصة.'
kpi.3.formula: 'متوسط(تاريخ الموافقة − تاريخ التقديم) بأيام العمل'
kpi.3.trigger_rule: 'أكثر من 5 أيام للتجاري أو 14 يوماً للبناء، 3 أشهر متتالية'

kpi.4.name: 'نسبة تغطية الخدمات الحضرية'
kpi.4.short_name: 'تغطية الخدمات'
kpi.4.description: 'السكان القاطنون في أحياء بتغطية خدمية كاملة كنسبة من إجمالي السكان البلديين.'
kpi.4.formula: '(السكان في الأحياء المغطاة) ÷ (إجمالي سكان البلدية)'
kpi.4.trigger_rule: 'المؤشر أقل من 0.93 في أي شهر'

kpi.5.name: 'مؤشر صمود الأزمات والطوارئ'
kpi.5.short_name: 'صمود الطوارئ'
kpi.5.description: 'مؤشر مركّب لاكتمال التفتيش، مشاركة التدريبات، وزمن التعافي من الطوارئ.'
kpi.5.formula: 'مزيج موزون لمعدل التفتيش، مشاركة التدريب، وزمن التعافي'
kpi.5.trigger_rule: 'المؤشر أقل من 0.75 أو فشل تدريب رسمي'

kpi.6.name: 'رضا المستفيدين'
kpi.6.short_name: 'الرضا'
kpi.6.description: 'مؤشر رضا موزون حسب عدد السكان من المسح الفصلي للخدمات البلدية.'
kpi.6.formula: 'درجة فصلية بنمط NPS، موزونة بعدد سكان البلدية'
kpi.6.trigger_rule: 'المؤشر أقل من 0.70 فصلياً أو انخفاض أكبر من 0.05'

