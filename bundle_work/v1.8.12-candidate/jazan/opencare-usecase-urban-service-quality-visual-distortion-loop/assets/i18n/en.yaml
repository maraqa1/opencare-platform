contract_version: '1.7.1'
locale: en-US
direction: ltr

# === Strategic objective ===
objective.name: 'Sustain and improve municipal service quality and visual distortion response'
objective.description: 'Strategic outcome under Vision 2030 Quality of Life Program and MOMRAH Municipal Performance Index covering 25 municipalities in Jazan region.'

# === KPIs ===
kpi.1.name: 'Visual distortion closure quality'
kpi.1.short_name: 'Visual distortion'
kpi.1.description: 'Quality of execution when closing visual-distortion cases — evidence verification, SLA compliance, and durability.'
kpi.1.formula: '(Cases closed with verified evidence within SLA) ÷ (Total cases closed in month)'
kpi.1.trigger_rule: 'KPI < 0.75 for 2 weeks OR forecast breach probability > 0.70'

kpi.2.name: 'Service request closure rate'
kpi.2.short_name: 'Service requests'
kpi.2.description: 'Percentage of citizen service requests completed within SLA, excluding rejected requests.'
kpi.2.formula: '(Service requests closed within SLA) ÷ (Total service requests received minus rejected)'
kpi.2.trigger_rule: 'KPI < 0.85 for 2 consecutive weeks'

kpi.3.name: 'Average permit issuance time'
kpi.3.short_name: 'Permit time'
kpi.3.description: 'Mean working days from permit submission to approval, per permit category.'
kpi.3.formula: 'mean(approval_date − submission_date) in working days'
kpi.3.trigger_rule: '> 5 days commercial OR > 14 days building, 3 consecutive months'

kpi.4.name: 'Urban service coverage'
kpi.4.short_name: 'Service coverage'
kpi.4.description: 'Population living in districts with full service coverage as a fraction of total municipal population.'
kpi.4.formula: '(Population in districts with full coverage) ÷ (Total municipal population)'
kpi.4.trigger_rule: 'KPI < 0.93 in any month'

kpi.5.name: 'Emergency and resilience readiness'
kpi.5.short_name: 'Emergency readiness'
kpi.5.description: 'Composite of inspection completion, drill participation, and emergency recovery time.'
kpi.5.formula: 'Weighted composite of inspection rate, drill participation, recovery time'
kpi.5.trigger_rule: 'KPI < 0.75 OR drill failure event'

kpi.6.name: 'Citizen satisfaction'
kpi.6.short_name: 'Satisfaction'
kpi.6.description: 'Population-weighted satisfaction index from quarterly municipal services survey.'
kpi.6.formula: 'Quarterly NPS-style score, weighted by municipality population'
kpi.6.trigger_rule: 'KPI < 0.70 quarterly OR drop > 0.05'

