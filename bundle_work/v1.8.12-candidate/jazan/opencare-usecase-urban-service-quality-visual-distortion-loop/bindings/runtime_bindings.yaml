kind: RuntimeBindings
use_case_slug: urban-service-quality-visual-distortion-loop
runtime_bindings:
- runtime_id: rt_jazan_service_rnn_forecast
  outputs:
  - output.jazan_service_rnn_forecast
  api_endpoints:
  - /runtimes
  - /runtimes/{runtime_id}/history
  screens:
  - SCREEN-L3-CASE
  - SCREEN-CC-RUNTIMES
  components:
  - rnn_forecast_chart
  - composite_risk_score_card
  - runtime_execution_history
  decisions:
  - decision.review_kpi_breach
  - decision.approve_corrective_action
  governance_evidence:
  - runtime_execution_log
  - lineage
  - freshness
- runtime_id: rt_jazan_service_anomaly
  outputs:
  - output.jazan_service_quality_anomaly
  api_endpoints:
  - /runtimes
  - /runtimes/{runtime_id}/history
  screens:
  - SCREEN-L3-CASE
  - SCREEN-CC-RUNTIMES
  components:
  - rnn_forecast_chart
  - composite_risk_score_card
  - runtime_execution_history
  decisions:
  - decision.review_kpi_breach
  - decision.approve_corrective_action
  governance_evidence:
  - runtime_execution_log
  - lineage
  - freshness
- runtime_id: rt_jazan_decision_candidate
  outputs:
  - decision.jazan_generated_service_decisions
  - decision.jazan_service_quality_action_queue
  api_endpoints:
  - /runtimes
  - /runtimes/{runtime_id}/history
  screens:
  - SCREEN-L3-CASE
  - SCREEN-CC-RUNTIMES
  components:
  - rnn_forecast_chart
  - composite_risk_score_card
  - runtime_execution_history
  decisions:
  - decision.review_kpi_breach
  - decision.approve_corrective_action
  governance_evidence:
  - runtime_execution_log
  - lineage
  - freshness
locale:
  default: en
  supported:
  - en
  - ar
  direction:
    en: ltr
    ar: rtl
  text_policy: all user-visible labels must use locale-aware text or i18n keys
external_action_policy:
  human_authorisation_required: true
  applies_to:
  - email_notification
  - ticket_creation
  - external_escalation
  - external_system_update
  - runtime_trigger_with_external_side_effect
  default_behavior: block_until_confirmed
  audit_required: true
