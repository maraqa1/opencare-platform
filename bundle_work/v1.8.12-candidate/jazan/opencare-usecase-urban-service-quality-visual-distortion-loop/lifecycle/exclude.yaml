kind: LifecycleAction
use_case_slug: urban-service-quality-visual-distortion-loop
action: exclude
steps:
- id: hide_ from_ active_ navigation
  label: hide from active navigation
  required: true
- id: preserve_ audit_ and_ decision_ history
  label: preserve audit and decision history
  required: true
locale:
  default: en
  supported:
  - en
  - ar
  direction:
    en: ltr
    ar: rtl
  text_policy: all user-visible labels must use locale-aware text or i18n keys
external_action_policy:
  human_authorisation_required: true
  applies_to:
  - email_notification
  - ticket_creation
  - external_escalation
  - external_system_update
  - runtime_trigger_with_external_side_effect
  default_behavior: block_until_confirmed
  audit_required: true
