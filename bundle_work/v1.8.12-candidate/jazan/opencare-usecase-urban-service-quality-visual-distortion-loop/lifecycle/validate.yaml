kind: LifecycleAction
use_case_slug: urban-service-quality-visual-distortion-loop
action: validate
steps:
- id: run_ yaml_ schema_ validation
  label: run YAML/schema validation
  required: true
- id: run_ business_ alignment_ check
  label: run business alignment check
  required: true
- id: run_ platform_ capability_ check
  label: run platform capability check
  required: true
- id: run_ acceptance_ check
  label: run acceptance check
  required: true
locale:
  default: en
  supported:
  - en
  - ar
  direction:
    en: ltr
    ar: rtl
  text_policy: all user-visible labels must use locale-aware text or i18n keys
external_action_policy:
  human_authorisation_required: true
  applies_to:
  - email_notification
  - ticket_creation
  - external_escalation
  - external_system_update
  - runtime_trigger_with_external_side_effect
  default_behavior: block_until_confirmed
  audit_required: true
