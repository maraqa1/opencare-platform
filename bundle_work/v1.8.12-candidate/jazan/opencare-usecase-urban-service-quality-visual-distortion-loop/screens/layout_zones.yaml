  - strategic_objective_band
  - kpi_state_summary_strip
  - kpi_connector_rail
  - kpi_threshold_card_grid
  - highest_priority_case_alert
  zones:
  - zone_id: page_header
    zone_purpose: Top title and demo/status chips
    width_intent: full
    nesting_rules: must remain a distinct dashboard region
    required_components:
    - page_header_bar
    - demo_status_chip
    - route_status_chip
    visual_dependency_between_zones: preserve declared reading order
    component_lock: zone_component_binding_required
    flattening_forbidden: true
    render_assertion: zone page_header must render components page_header_bar, demo_status_chip, route_status_chip in this zone; these components
      may not be moved to a generic shell
    acceptance_evidence:
    - route_component_inventory
    - screenshot_region_check
    - zone_component_presence_check
  - zone_id: strategic_objective_band
    zone_purpose: Purple objective band with strategic objective, codes, alignment chips, and municipality coverage
    width_intent: full
    nesting_rules: must remain a distinct dashboard region
    required_components:
    - strategic_objective_header
    - objective_metadata_chips
    - municipality_coverage_chip
    visual_dependency_between_zones: preserve declared reading order
    component_lock: zone_component_binding_required
    flattening_forbidden: true
    render_assertion: zone strategic_objective_band must render components strategic_objective_header, objective_metadata_chips, municipality_coverage_chip
      in this zone; these components may not be moved to a generic shell
    acceptance_evidence:
    - route_component_inventory
    - screenshot_region_check
    - zone_component_presence_check
  - zone_id: kpi_state_summary_strip
    zone_purpose: 'Four counters: meeting target, approaching trigger, in breach, decision candidates'
    width_intent: full
    nesting_rules: must remain a distinct dashboard region
    required_components:
