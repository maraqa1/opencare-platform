    - screenshot_region_check
    - zone_component_presence_check
  - zone_id: highest_priority_case_alert
    zone_purpose: Red alert band with highest-priority seeded case and Review case action
    width_intent: full
    nesting_rules: must remain a distinct dashboard region
    required_components:
