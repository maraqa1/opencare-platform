kind: DashboardLayoutZones
use_case_slug: urban-service-quality-visual-distortion-loop
rule: Each canonical dashboard must render the declared zones in order; zones may not be collapsed into generic shell sections.
dashboards:
- dashboard_id: 01_strategic_objective_monitoring
