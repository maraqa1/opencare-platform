    component_lock: zone_component_binding_required
    flattening_forbidden: true
    render_assertion: zone kpi_state_summary_strip must render components kpi_state_summary_strip, meeting_target_counter, approaching_trigger_counter,
      in_breach_counter, decision_candidate_counter in this zone; these components may not be moved to a generic shell
    acceptance_evidence:
    - route_component_inventory
    - screenshot_region_check
    - zone_component_presence_check
  - zone_id: kpi_connector_rail
    zone_purpose: Connector rail linking KPI markers to KPI cards
    width_intent: full
    nesting_rules: must remain a distinct dashboard region
    required_components:
    - kpi_connector_rail
    - kpi_marker_sequence
    - kpi_to_card_connectors
    visual_dependency_between_zones: preserve declared reading order
    component_lock: zone_component_binding_required
    flattening_forbidden: true
