kind: DashboardVisualGrammar
use_case_slug: urban-service-quality-visual-distortion-loop
global:
  density: operational_compact
  card_density: compact
  section_spacing: tight_but_readable
  status_badge_rules: status badges must include text and colour role; colour alone is insufficient
  severity_colour_roles:
    meeting_target: green
    approaching_trigger: amber
    in_breach: red
    decision_candidate: blue
    needs_data: neutral
  threshold_rail_required: required on KPI threshold cards where thresholds exist
  connector_line_required: required where dashboard declares a sequence or KPI connector rail
  active_case_banner_required: required on screens with an active seeded case
  CTA_prominence: primary workflow action must be visually distinct and text-labelled
  bilingual_label_placement: English primary label with Arabic sublabel where declared
  must_not_flatten:
  - KPI connector rails
  - threshold rails
  - active case alert bands
  - decision action controls
  - runtime evidence cards
  - audit timelines
  design_notes_contract_truth: true
  typography:
    allowed_font_weights:
    - 400
    - 500
    forbidden_font_weights:
    - 600
    - 700
    - 800
    - 900
    header_size: 17-18px
    body_size: 11-12px
    small_label_size: 9-10px
    rule: no heavy marketing weights
  colour_policy:
    state_only: true
    red: reserved for breach/failure
    amber: reserved for warning/degraded
    green: reserved for success/recovered
    purple: strategic objective and HITL only
    blue: information only
    decorative_colour_forbidden: true
  rounding_policy:
    kpi_values_decimals: 2
    days_decimals: 1
    counts: integer
    js_float_leakage_forbidden: true
  empty_state_policy:
    honest_absence_required: true
    no_fake_zero: true
    no_fake_green: true
  confirmation_modal_policy:
    payload_preview_required: true
    generic_are_you_sure_forbidden: true
