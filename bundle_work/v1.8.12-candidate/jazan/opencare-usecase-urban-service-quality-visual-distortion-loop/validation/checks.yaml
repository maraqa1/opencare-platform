hard_fail_rules:
- All canonical metadata layout_ref fields must point to screens/layout_zones.yaml dashboard IDs and must not reference deprecated screens/layouts.yaml
- No screen component without business alignment row
- No runtime without runtime image declaration
- No action button without audit event
- No platform capability assumption without platform_capabilities entry
- No dashboard component based only on mockup
- Dashboard implementation matrix, story flow, and fidelity contract are mandatory
- Declared dashboard IDs must match across matrix, story flow, and fidelity contract
- Dashboard routes must match across matrix, story flow, and fidelity contract
- No dashboard may be collapsed into another shell shape
- All backend response_schema_ref paths must resolve
- All action button options_source values must resolve to declared data entities
- External action enforcement must be marked partially_supported until platform enforcement is proven
- Action button owner lookup entities must have a source system, raw landing table, staging model, analytics model, dbt model index entry, and SQL files
- YAML contracts with matching schemas must be validated against those schemas, not only YAML-parsed
- Layout zones, visual grammar, component anatomy, bilingual contract, and rendered conformance are mandatory for dashboard-rigid bundles
- Required dashboard IDs must match across layout zones, visual grammar, anatomy, fidelity, matrix, story flow, and mockup traceability
- Every visual non-negotiable must be backed by fidelity or visual grammar contract
- Every layout zone must declare at least one required component
- Every required zone component must resolve to screens/components.yaml or screens/component_anatomy.yaml
- Rendered dashboard conformance must declare per-dashboard evidence for every canonical dashboard
- Every canonical dashboard must have a rendered gap register template
- Every required zone component must be covered by bilingual_contract directly or by family rule
- screens/layouts.yaml is deprecated and must not be referenced as canonical layout_contract
- dashboard_implementation_matrix required_components must exactly equal the union of layout_zones required_components for each dashboard
- legacy legacy level-one broad component identifiers, legacy level-two broad component identifiers, legacy level-three broad component identifiers, and legacy command-centre broad component identifiers component ids are forbidden in canonical dashboard_implementation_matrix required_components
- Canonical acceptance checks must use zone-rigid component vocabulary only
- Canonical data bindings must use zone-rigid component IDs only
- screens/components.yaml must define only zone-rigid canonical components and no legacy broad component IDs
- Every required zone component must have a matching data binding and component contract
- No legacy l1/l2/l3/cc component prefixes may appear in canonical acceptance, bindings, or component contracts
- Case decision command tab must not render a multi-case queue
- Case decision command tab and cross-cutting queue must remain separate
- SCREEN-L3-CASE-RECOVERY must exist in screen_catalog
- Level 3 overview tab must not be canonical default
- 03_case_model_intelligence must not own authorisation actions
- action_lifecycle must exist as a decision snapshot table with decision_action_events as append-only event stream
- Every external action must resolve to action_lifecycle plus audit_event linkage
- Every dashboard-visible KPI must declare explicit formula_plain_language and reconciliation_status
- package.yaml must expose one coherent package version and one coherent template compatibility version
- Synthetic demo data generator plus required CSV outputs must exist and maintain referential integrity
locale:
  default: en
  supported:
  - en
  - ar
  direction:
    en: ltr
    ar: rtl
  text_policy: all user-visible labels must use locale-aware text or i18n keys
