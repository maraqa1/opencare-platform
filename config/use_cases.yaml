use_cases:
  jazan_strategy_kpi_governance:
    name: "Strategy & KPI Governance"
    description: "Govern strategic objectives, KPI definitions, ownership, targets, evidence, and performance score roll-up for Jazan Municipality."
    enabled: true
    source_tables:
      - strategic_objectives
      - kpi_dictionary
      - municipal_scorecards
      - kpi_targets
      - evidence_register
    portal_pages:
      - slug: "kpi-governance"
        label: "KPI Governance"
        icon: "target"
        tab_order: 1
    api_prefix: "/api/v1/jazan/kpi-governance"
    api_endpoints:
      - path: "/scorecards"
        method: "GET"
      - path: "/kpis"
        method: "GET"
      - path: "/evidence"
        method: "GET"
    business_objectives:
      - "Cascade strategic objectives from vision to municipality-level scorecards."
      - "Publish governed KPI definitions with formula, ownership, targets, and evidence."
      - "Create an auditable source of truth for Jazan performance reporting."
    record_specs:
      - table: "analytics.fct_jazan_kpi_status"
        grain: "One row per KPI, period, owner, and reporting level."
      - table: "dictionary.dict_jazan_kpis"
        grain: "One row per governed KPI definition."
  jazan_performance_early_warning:
    name: "Performance Early Warning"
    description: "Detect delays, anomalies, and performance risks across municipal initiatives before they become executive escalations."
    enabled: true
    source_tables:
      - municipal_projects
      - performance_observations
      - risk_signals
      - corrective_actions
      - review_decisions
    portal_pages:
      - slug: "early-warning"
        label: "Early Warning"
        icon: "alert-triangle"
        tab_order: 1
    api_prefix: "/api/v1/jazan/early-warning"
    api_endpoints:
      - path: "/signals"
        method: "GET"
      - path: "/risks"
        method: "GET"
      - path: "/actions"
        method: "GET"
    business_objectives:
      - "Surface delay forecasts, anomalies, and risk heatmaps for leadership attention."
      - "Connect each warning to root cause, owner, escalation, and closure."
      - "Support monthly leadership review packs and decisions."
    record_specs:
      - table: "analytics.fct_jazan_early_warning"
        grain: "One row per signal, entity, period, severity, and owner."
      - table: "analytics.fct_jazan_corrective_action"
        grain: "One row per corrective action and lifecycle state."
  jazan_executive_cockpit:
    name: "Executive Performance Cockpit"
    description: "Give Jazan leadership a unified cockpit for performance score, risks, corrective actions, and evidence-backed decisions."
    enabled: true
    source_tables:
      - municipal_scorecards
      - target_outcomes
      - operating_rhythm
      - leadership_decisions
      - success_measures
    portal_pages:
      - slug: "executive-cockpit"
        label: "Executive Cockpit"
        icon: "layout-dashboard"
        tab_order: 1
    api_prefix: "/api/v1/jazan/executive-cockpit"
    api_endpoints:
      - path: "/summary"
        method: "GET"
      - path: "/outcomes"
        method: "GET"
      - path: "/decisions"
        method: "GET"
    business_objectives:
      - "Provide executive visibility into strategic alignment, accountability, operational excellence, and citizen impact."
      - "Show success measures, operating rhythm, and decision follow-up in one leadership surface."
      - "Keep every score and action backed by governed evidence."
    record_specs:
      - table: "analytics.fct_jazan_executive_scorecard"
        grain: "One row per executive outcome, period, and municipality roll-up."
      - table: "analytics.fct_jazan_leadership_decision"
        grain: "One row per leadership decision and follow-up status."
