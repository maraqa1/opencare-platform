version: 1

dashboards:
  bed_pressure:
    enabled: true
    use_case: bed_pressure
    dashboard_id: bed-occupancy-trends
    title: Hospital Capacity Command Centre
    filter_bar_orientation: HORIZONTAL
    markdowns:
      - key: executive_header
        layout:
          x: 0
          y: 0
          w: 12
          h: 6
        code: |
          # Hospital Capacity & Patient Flow Command Dashboard

          _Real-time view of bed pressure, ward risk, admissions flow, and escalation priorities across the hospital network._

          **Executive summary**
          Network occupancy is currently **{network_occupancy_rate_pct}%**, with **{network_available_beds} beds** available across the hospital network. **{critical_phrase}** and **{warning_phrase}**. Capacity remains **{capacity_status_lower}**, and the immediate management focus should be on **{management_focus}**.

          _Latest network snapshot: {as_of_date}_
    schema: analytics
    datasets:
      - analytics.fct_bed_pressure_daily_summary
      - analytics.fct_bed_pressure_executive_actions
    filters:
      - key: date_range
        type: native_filter
        label: Date Range
        target_dataset: analytics.fct_bed_pressure_daily_summary
        column: date_day
        control: date_range
        default: Last 30 days
        presets:
          - 7d
          - 30d
          - 90d
          - 180d
        chart_scope:
          - network_occupancy
          - available_beds
          - critical_wards
          - warning_wards
          - net_patient_flow
          - network_occupancy_trend
          - admissions_vs_discharges
      - key: ward
        type: native_filter
        label: Ward
        target_dataset: analytics.fct_bed_pressure_executive_actions
        column: ward
        control: multi_select
        searchable: true
        placeholder: All wards
        default_label: All wards
        chart_scope:
          - pressure_status
          - top_wards
          - executive_actions_required
      - key: specialty
        type: native_filter
        label: Specialty
        target_dataset: analytics.fct_bed_pressure_executive_actions
        column: specialty
        control: multi_select
        searchable: true
        placeholder: All specialties
        default_label: All specialties
        chart_scope:
          - pressure_status
          - top_wards
          - executive_actions_required
    charts:
      - key: network_occupancy
        enabled: true
        title: Capacity Utilisation
        viz_type: big_number
        layout:
          x: 0
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - network_occupancy_rate_pct
        x_axis: date_day
        time_column: date_day
        time_range: Last 30 days
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: "{capacity_status} · 85% warning / 95% critical"
          colorPicker:
            r: 74
            g: 119
            b: 243
            a: 1
          y_axis_format: ".1f"
          color_scheme: supersetColors
          timeRangeFixed: true
      - key: available_beds
        enabled: true
        title: Beds Available Now
        viz_type: big_number
        layout:
          x: 2
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - network_available_beds
        x_axis: date_day
        time_column: date_day
        time_range: Last 30 days
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: "{bed_reserve_status}"
          colorPicker:
            r: 56
            g: 161
            b: 105
            a: 1
          y_axis_format: ".0f"
          color_scheme: d3Category20
          timeRangeFixed: true
      - key: critical_wards
        enabled: true
        title: Critical Ward Count
        viz_type: big_number
        layout:
          x: 4
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - critical_ward_count
        x_axis: date_day
        time_column: date_day
        time_range: Last 30 days
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: Immediate escalation required
          colorPicker:
            r: 196
            g: 76
            b: 71
            a: 1
          y_axis_format: ".0f"
          color_scheme: fire
          timeRangeFixed: true
      - key: warning_wards
        enabled: true
        title: Wards Requiring Attention
        viz_type: big_number
        layout:
          x: 6
          y: 6
          w: 3
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - warning_ward_count
        x_axis: date_day
        time_column: date_day
        time_range: Last 30 days
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: Monitor closely
          colorPicker:
            r: 214
            g: 149
            b: 53
            a: 1
          y_axis_format: ".0f"
          color_scheme: preswald
          timeRangeFixed: true
      - key: net_patient_flow
        enabled: true
        title: Net Patient Flow
        viz_type: big_number
        layout:
          x: 9
          y: 6
          w: 3
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - net_flow
        x_axis: date_day
        time_column: date_day
        time_range: Last 30 days
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: "{net_flow_status}"
          colorPicker:
            r: 23
            g: 51
            b: 107
            a: 1
          y_axis_format: ".0f"
          color_scheme: supersetColors
          timeRangeFixed: true
      - key: network_occupancy_trend
        enabled: true
        title: 7-Day Capacity Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 14
          w: 8
          h: 14
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - network_occupancy_rate_pct
          - peak_ward_occupancy_pct
          - name: warning_threshold
            expressionType: SQL
            sqlExpression: "85"
            label: Warning Threshold
          - name: critical_threshold
            expressionType: SQL
            sqlExpression: "95"
            label: Critical Threshold
          - name: full_capacity_threshold
            expressionType: SQL
            sqlExpression: "100"
            label: Full Capacity
        time_column: date_day
        time_range: Last 7 days
        row_limit: 14
        form_data:
          x_axis_time_format: smart_date
          y_axis_format: ".0f"
          color_scheme: supersetColors
          show_legend: true
          rich_tooltip: true
      - key: pressure_status
        enabled: true
        title: Ward Pressure Status
        viz_type: dist_bar
        layout:
          x: 8
          y: 14
          w: 4
          h: 14
        dataset: analytics.fct_bed_pressure_executive_actions
        metrics:
          - ward_row_count
        group_by:
          - risk_level
        row_limit: 20
        sort_desc: true
        form_data:
          show_legend: false
          color_scheme: supersetColors
          y_axis_format: ".0f"
          sort_by_metric: true
          truncate_metric: false
      - key: top_wards
        enabled: true
        title: Top Wards by Occupancy
        viz_type: dist_bar
        layout:
          x: 0
          y: 28
          w: 6
          h: 13
        dataset: analytics.fct_bed_pressure_executive_actions
        metrics:
          - current_occupancy_pct
        group_by:
          - ward
        row_limit: 8
        sort_desc: true
        form_data:
          show_legend: false
          color_scheme: supersetColors
          y_axis_format: ".1f"
          truncate_metric: false
          sort_by_metric: true
      - key: admissions_vs_discharges
        enabled: true
        title: Patient Flow Balance
        viz_type: echarts_area
        layout:
          x: 6
          y: 28
          w: 6
          h: 13
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - admissions_total
          - discharges_total
          - net_flow
        time_column: date_day
        time_range: Last 30 days
        row_limit: 30
        form_data:
          color_scheme: d3Category20
          show_legend: true
          x_axis_time_format: smart_date
          y_axis_format: ".0f"
      - key: executive_actions_required
        enabled: true
        title: Executive Actions Required
        viz_type: table
        layout:
          x: 0
          y: 41
          w: 12
          h: 14
        dataset: analytics.fct_bed_pressure_executive_actions
        metrics:
          - name: current_occupancy_pct
            column: current_occupancy_pct
            aggregate: MAX
            label: Current Occupancy
          - name: available_beds
            column: available_beds
            aggregate: MAX
            label: Beds Available
        group_by:
          - ward
          - risk_level
          - issue
          - required_action
          - owner
          - target_time
        row_limit: 25
        sort_desc: true
        form_data:
          color_scheme: supersetColors

  staff_scheduling:
    enabled: false
    use_case: staff_scheduling
    dashboard_id: staff-utilization
    title: Staff Scheduling Pressure
    schema: analytics
    datasets:
      - analytics.staffing_pressure_daily
    filters:
      - key: ward
        type: native_filter
        label: Ward
        target_dataset: analytics.staffing_pressure_daily
        column: ward_id
        control: multi_select
        searchable: true
    charts:
      - key: staffing_pressure_trend
        enabled: true
        title: Staffing Pressure Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 0
          w: 12
          h: 14
        dataset: analytics.staffing_pressure_daily
        metrics:
          - staffing_pressure_index
        time_column: date_day
  revenue_cycle_management:
    enabled: true
    use_case: revenue_cycle_management
    dashboard_id: revenue-cycle-management
    title: Revenue Cycle Executive Command
    schema: analytics
    datasets:
      - analytics.fct_cash_forecast
      - analytics.fct_revenue_cycle
      - analytics.fct_denials
      - analytics.fct_cash_recovery_opportunity
      - analytics.fct_revenue_leakage
      - analytics.fct_claim_aging
      - analytics.fct_payer_contract_performance
      - analytics.fct_team_recovery_performance
    filters:
      - key: payer
        type: native_filter
        label: Payer
        target_dataset: analytics.fct_revenue_cycle
        column: payer_id
        control: multi_select
        searchable: true
      - key: department
        type: native_filter
        label: Department
        target_dataset: analytics.fct_revenue_cycle
        column: department_id
        control: multi_select
        searchable: true
      - key: date_range
        type: native_filter
        label: Date Range
        target_dataset: analytics.fct_revenue_cycle
        column: claim_date
        control: date_range
        default: No filter
        presets:
          - 30d
          - 90d
          - 180d
      - key: owner_team
        type: native_filter
        label: Owner Team
        target_dataset: analytics.fct_cash_recovery_opportunity
        column: owner_team
        control: multi_select
        searchable: true
    charts:
      - key: executive_cash_position
        enabled: true
        title: Executive Cash Position
        viz_type: table
        layout:
          x: 0
          y: 0
          w: 12
          h: 8
        dataset: analytics.fct_cash_forecast
        metrics:
          - expected_cash_sum
          - recoverable_cash_sum
          - cash_at_risk_sum
          - confidence_score_avg
      - key: cash_forecast_and_risk
        enabled: true
        title: Expected Cash and Risk Outlook
        viz_type: echarts_area
        layout:
          x: 0
          y: 8
          w: 8
          h: 12
        dataset: analytics.fct_cash_forecast
        metrics:
          - expected_cash_sum
          - recoverable_cash_sum
          - cash_at_risk_sum
        time_column: forecast_date
        row_limit: 180
      - key: ar_exposure_by_claim_status
        enabled: true
        title: Open A/R Exposure by Claim Status
        viz_type: dist_bar
        layout:
          x: 8
          y: 8
          w: 4
          h: 12
        dataset: analytics.fct_claim_aging
        metrics:
          - outstanding_amount_sum
        group_by:
          - claim_status
      - key: billed_vs_collected_trend
        enabled: true
        title: Gross Charges vs Posted Cash
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 20
          w: 8
          h: 12
        dataset: analytics.fct_revenue_cycle
        metrics:
          - gross_billed_amount_sum
          - posted_cash_amount_sum
        time_column: claim_date
        row_limit: 180
      - key: denial_pressure_over_time
        enabled: true
        title: Denial Pressure Over Time
        viz_type: echarts_timeseries_bar
        layout:
          x: 8
          y: 20
          w: 4
          h: 12
        dataset: analytics.fct_denials
        metrics:
          - denied_amount_sum
        group_by:
          - denial_reason
        time_column: denial_date
        row_limit: 180
      - key: underpayment_exposure_by_payer
        enabled: true
        title: Underpayment Exposure by Payer
        viz_type: dist_bar
        layout:
          x: 0
          y: 32
          w: 6
          h: 12
        dataset: analytics.fct_payer_contract_performance
        metrics:
          - underpayment_amount_sum
        group_by:
          - payer_id
      - key: payer_collection_vs_contract
        enabled: true
        title: Payer Collection Rate vs Contract
        viz_type: dist_bar
        layout:
          x: 6
          y: 32
          w: 6
          h: 12
        dataset: analytics.fct_payer_contract_performance
        metrics:
          - actual_collection_rate_avg
          - contract_rate_pct_avg
        group_by:
          - payer_id
      - key: leakage_concentration_by_type
        enabled: true
        title: Revenue Leakage Concentration
        viz_type: dist_bar
        layout:
          x: 0
          y: 44
          w: 6
          h: 12
        dataset: analytics.fct_revenue_leakage
        metrics:
          - leakage_amount_sum
        group_by:
          - leakage_type
      - key: team_recovery_vs_target
        enabled: true
        title: Team Recovery vs Expected Value
        viz_type: dist_bar
        layout:
          x: 6
          y: 44
          w: 6
          h: 12
        dataset: analytics.fct_team_recovery_performance
        metrics:
          - actual_recovery_sum
          - expected_recovery_sum
        group_by:
          - owner_team
      - key: executive_recovery_actions
        enabled: true
        title: Executive Recovery Actions This Week
        viz_type: table
        layout:
          x: 0
          y: 56
          w: 12
          h: 12
        dataset: analytics.fct_cash_recovery_opportunity
        metrics:
          - recoverable_amount_sum
          - expected_recovery_amount_sum
          - priority_score_avg
        group_by:
          - issue_type
          - owner_team
