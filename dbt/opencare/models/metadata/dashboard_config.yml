version: 1

dashboards:
  bed_pressure:
    enabled: true
    use_case: bed_pressure
    dashboard_id: bed-occupancy-trends
    title: Bed Occupancy Intelligence
    schema: analytics
    datasets:
      - analytics.fct_bed_occupancy
      - analytics.dim_ward
      - analytics.dim_date
    filters:
      - key: ward
        type: native_filter
        label: Ward
        target_dataset: analytics.fct_bed_occupancy
        column: ward_id
        control: multi_select
        searchable: true
      - key: date_range
        type: native_filter
        label: Date Range
        target_dataset: analytics.fct_bed_occupancy
        column: date_day
        control: date_range
        default: Last 30 days
        presets:
          - 7d
          - 14d
          - 30d
          - 90d
    charts:
      - key: occupancy_trend_30d
        enabled: true
        title: 30-Day Occupancy Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 0
          w: 12
          h: 16
        dataset: analytics.fct_bed_occupancy
        metrics:
          - avg_occupancy_rate
        group_by:
          - ward_id
        time_column: date_day
        row_limit: 1200
        reference_lines:
          - label: Critical Threshold
            value: 0.90
            color: "#B71C1C"
          - label: Warning Threshold
            value: 0.75
            color: "#E65100"
      - key: ward_comparison
        enabled: true
        title: Ward Comparison
        viz_type: echarts_timeseries_bar
        layout:
          x: 0
          y: 16
          w: 5
          h: 12
        dataset: analytics.fct_bed_occupancy
        metrics:
          - current_occupancy_rate
        group_by:
          - ward_id
        time_column: date_day
        sort_desc: true
      - key: admissions_vs_discharges
        enabled: true
        title: Admissions vs Discharges
        viz_type: echarts_area
        layout:
          x: 5
          y: 16
          w: 7
          h: 12
        dataset: analytics.fct_bed_occupancy
        metrics:
          - admissions_total
          - discharges_total
        time_column: date_day
        row_limit: 120

  staff_scheduling:
    enabled: false
    use_case: staff_scheduling
    dashboard_id: staff-utilization
    title: Staff Scheduling Pressure
    schema: analytics
    datasets:
      - analytics.staffing_pressure_daily
    filters:
      - key: ward
        type: native_filter
        label: Ward
        target_dataset: analytics.staffing_pressure_daily
        column: ward_id
        control: multi_select
        searchable: true
    charts:
      - key: staffing_pressure_trend
        enabled: true
        title: Staffing Pressure Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 0
          w: 12
          h: 14
        dataset: analytics.staffing_pressure_daily
        metrics:
          - staffing_pressure_index
        time_column: date_day
  revenue_cycle_management:
    enabled: true
    use_case: revenue_cycle_management
    dashboard_id: revenue-cycle-management
    title: Revenue Cycle Management
    schema: analytics
    datasets:
      - analytics.fct_cash_recovery_opportunity
      - analytics.fct_revenue_leakage
      - analytics.fct_claim_aging
      - analytics.fct_payer_contract_performance
      - analytics.fct_team_recovery_performance
    charts:
      - key: cash_recovery_command
        enabled: true
        title: Cash Recovery Command
        viz_type: table
        layout:
          x: 0
          y: 0
          w: 6
          h: 12
        dataset: analytics.fct_cash_recovery_opportunity
        metrics:
          - recoverable_amount_sum
          - expected_recovery_amount_sum
          - priority_score_avg
        group_by:
          - issue_type
      - key: gross_to_net_waterfall
        enabled: true
        title: Gross to Net Revenue Waterfall
        viz_type: dist_bar
        layout:
          x: 6
          y: 0
          w: 6
          h: 12
        dataset: analytics.fct_revenue_leakage
        metrics:
          - leakage_amount_sum
        group_by:
          - leakage_type
      - key: ar_aging_trend
        enabled: true
        title: AR Aging Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 12
          w: 6
          h: 12
        dataset: analytics.fct_claim_aging
        metrics:
          - outstanding_amount_sum
        group_by:
          - payer_id
        time_column: snapshot_date
      - key: payer_contract_breaches
        enabled: true
        title: Payer Contract Breaches
        viz_type: dist_bar
        layout:
          x: 6
          y: 12
          w: 6
          h: 12
        dataset: analytics.fct_payer_contract_performance
        metrics:
          - sla_breach_count_sum
        group_by:
          - payer_id
      - key: underpayment_by_payer
        enabled: true
        title: Underpayment by Payer
        viz_type: dist_bar
        layout:
          x: 0
          y: 24
          w: 6
          h: 12
        dataset: analytics.fct_payer_contract_performance
        metrics:
          - underpayment_amount_sum
        group_by:
          - payer_id
      - key: recovery_queue
        enabled: true
        title: Recovery Queue
        viz_type: table
        layout:
          x: 6
          y: 24
          w: 6
          h: 12
        dataset: analytics.fct_cash_recovery_opportunity
        metrics:
          - expected_recovery_amount_sum
          - priority_score_avg
        group_by:
          - issue_type
          - owner_team
      - key: team_recovery_performance
        enabled: true
        title: Team Recovery Performance
        viz_type: dist_bar
        layout:
          x: 0
          y: 36
          w: 6
          h: 12
        dataset: analytics.fct_team_recovery_performance
        metrics:
          - actual_recovery_sum
          - expected_recovery_sum
        group_by:
          - owner_team
      - key: revenue_leakage_by_type
        enabled: true
        title: Revenue Leakage by Type
        viz_type: dist_bar
        layout:
          x: 6
          y: 36
          w: 6
          h: 12
        dataset: analytics.fct_revenue_leakage
        metrics:
          - leakage_amount_sum
        group_by:
          - leakage_type
