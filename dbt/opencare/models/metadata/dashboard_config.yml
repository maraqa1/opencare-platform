version: 1

dashboards:
  bed_pressure:
    enabled: true
    use_case: bed_pressure
    dashboard_id: bed-occupancy-trends
    title: Hospital Capacity Command Centre
    layout_mode: tabbed
    tab_title: Overview
    filter_bar_orientation: HORIZONTAL
    markdowns:
      - key: executive_header
        layout:
          x: 0
          y: 0
          w: 12
          h: 6
        code: |
          # Hospital Capacity & Patient Flow Command Dashboard

          _Real-time view of bed pressure, ward risk, admissions flow, and escalation priorities across the hospital network._

          **Executive summary**
          Network occupancy is currently **{network_occupancy_rate_pct}%**, with **{network_available_beds} beds** available across the hospital network. **{critical_phrase}** and **{warning_phrase}**. Capacity remains **{capacity_status_lower}**, and the immediate management focus should be on **{management_focus}**.

          _Latest network snapshot: {as_of_date}_
    schema: analytics
    datasets:
      - analytics.fct_bed_pressure_daily_summary
      - analytics.fct_bed_pressure_executive_actions
      - analytics.fct_bed_pressure_latest_snapshot
      - analytics.fct_bed_pressure_distribution
    dataset_column_labels:
      analytics.fct_bed_pressure_executive_actions:
        ward: Ward
        risk_level_badge: Risk
        executive_priority_badge: Executive Priority
        issue_badge: Issue
        required_action_badge: Required Action
        owner_badge: Owner
        target_time_badge: Target Time
        current_occupancy_pct: Occupancy %
        available_beds: Beds Available
        risk_sort_score: Risk Sort
    filters:
      - key: date_range
        type: native_filter
        label: Date Range
        target_datasets:
          - analytics.fct_bed_pressure_daily_summary
          - analytics.fct_bed_pressure_distribution
        column: date_day
        control: date_range
        default: No filter
        presets:
          - 7d
          - 30d
          - 90d
          - 180d
        chart_scope:
          - network_occupancy
          - available_beds
          - critical_wards
          - warning_wards
          - net_patient_flow
          - network_occupancy_trend
          - admissions_vs_discharges
          - specialty_occupancy_boxplot
      - key: ward
        type: native_filter
        label: Ward
        target_datasets:
          - analytics.fct_bed_pressure_executive_actions
          - analytics.fct_bed_pressure_latest_snapshot
          - analytics.fct_bed_pressure_distribution
        column: ward
        control: select
        searchable: true
        placeholder: All wards
        default_label: All wards
        chart_scope:
          - pressure_status
          - top_wards
          - executive_actions_required
          - ward_pressure_bubble
          - capacity_treemap
          - specialty_occupancy_boxplot
      - key: specialty
        type: native_filter
        label: Specialty
        target_datasets:
          - analytics.fct_bed_pressure_executive_actions
          - analytics.fct_bed_pressure_latest_snapshot
          - analytics.fct_bed_pressure_distribution
        column: specialty
        control: select
        searchable: true
        placeholder: All specialties
        default_label: All specialties
        chart_scope:
          - pressure_status
          - top_wards
          - executive_actions_required
          - ward_pressure_bubble
          - capacity_treemap
          - specialty_occupancy_boxplot
    charts:
      - key: network_occupancy
        enabled: true
        title: Capacity Utilisation
        viz_type: big_number
        layout:
          x: 0
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - network_occupancy_rate_pct
        x_axis: date_day
        time_column: date_day
        time_range: "{latest_30d_range}"
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: "{capacity_status} - 85% warning / 95% critical"
          colorPicker:
            r: 74
            g: 119
            b: 243
            a: 1
          y_axis_format: ".1f"
          color_scheme: supersetColors
          timeRangeFixed: true
      - key: available_beds
        enabled: true
        title: Beds Available Now
        viz_type: big_number
        layout:
          x: 2
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - network_available_beds
        x_axis: date_day
        time_column: date_day
        time_range: "{latest_30d_range}"
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: "{bed_reserve_status}"
          colorPicker:
            r: 56
            g: 161
            b: 105
            a: 1
          y_axis_format: ".0f"
          color_scheme: d3Category20
          timeRangeFixed: true
      - key: critical_wards
        enabled: true
        title: Critical Ward Count
        viz_type: big_number
        layout:
          x: 4
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - critical_ward_count
        x_axis: date_day
        time_column: date_day
        time_range: "{latest_30d_range}"
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: Immediate escalation required
          colorPicker:
            r: 196
            g: 76
            b: 71
            a: 1
          y_axis_format: ".0f"
          color_scheme: fire
          timeRangeFixed: true
      - key: warning_wards
        enabled: true
        title: Wards Requiring Attention
        viz_type: big_number
        layout:
          x: 6
          y: 6
          w: 3
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - warning_ward_count
        x_axis: date_day
        time_column: date_day
        time_range: "{latest_30d_range}"
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: Monitor closely
          colorPicker:
            r: 214
            g: 149
            b: 53
            a: 1
          y_axis_format: ".0f"
          color_scheme: preswald
          timeRangeFixed: true
      - key: net_patient_flow
        enabled: true
        title: Net Patient Flow
        viz_type: big_number
        layout:
          x: 9
          y: 6
          w: 3
          h: 8
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - net_flow
        x_axis: date_day
        time_column: date_day
        time_range: "{latest_30d_range}"
        row_limit: 30
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous day
          subheader: "{net_flow_status}"
          colorPicker:
            r: 23
            g: 51
            b: 107
            a: 1
          y_axis_format: ".0f"
          color_scheme: supersetColors
          timeRangeFixed: true
      - key: network_occupancy_trend
        enabled: true
        title: 7-Day Capacity Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 14
          w: 8
          h: 14
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - network_occupancy_rate_pct
          - peak_ward_occupancy_pct
          - name: warning_threshold
            expressionType: SQL
            sqlExpression: "85"
            label: Warning Threshold
          - name: critical_threshold
            expressionType: SQL
            sqlExpression: "95"
            label: Critical Threshold
          - name: full_capacity_threshold
            expressionType: SQL
            sqlExpression: "100"
            label: Full Capacity
        time_column: date_day
        time_range: "{latest_7d_range}"
        row_limit: 14
        form_data:
          x_axis_time_format: smart_date
          y_axis_format: ".0f"
          color_scheme: supersetColors
          show_legend: true
          rich_tooltip: true
      - key: pressure_status
        enabled: true
        title: Ward Pressure Status
        viz_type: dist_bar
        layout:
          x: 8
          y: 14
          w: 4
          h: 14
        dataset: analytics.fct_bed_pressure_executive_actions
        metrics:
          - ward_row_count
        group_by:
          - risk_level
        row_limit: 20
        sort_desc: true
        form_data:
          show_legend: false
          color_scheme: supersetColors
          y_axis_format: ".0f"
          sort_by_metric: true
          truncate_metric: false
      - key: top_wards
        enabled: true
        title: Top Wards by Occupancy
        viz_type: dist_bar
        layout:
          x: 0
          y: 28
          w: 6
          h: 13
        dataset: analytics.fct_bed_pressure_executive_actions
        metrics:
          - current_occupancy_pct
        group_by:
          - ward
        row_limit: 8
        sort_desc: true
        form_data:
          show_legend: false
          color_scheme: supersetColors
          y_axis_format: ".1f"
          truncate_metric: false
          sort_by_metric: true
      - key: admissions_vs_discharges
        enabled: true
        title: Patient Flow Balance
        viz_type: echarts_area
        layout:
          x: 6
          y: 28
          w: 6
          h: 13
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - admissions_total
          - discharges_total
          - net_flow
        time_column: date_day
        time_range: "{latest_30d_range}"
        row_limit: 30
        form_data:
          color_scheme: d3Category20
          show_legend: true
          x_axis_time_format: smart_date
          y_axis_format: ".0f"
      - key: executive_actions_required
        enabled: true
        title: Executive Actions Required - Ward Escalation Board
        viz_type: table
        layout:
          x: 0
          y: 41
          w: 12
          h: 14
        dataset: analytics.fct_bed_pressure_executive_actions
        metrics:
          - name: risk_sort_score
            column: risk_sort_score
            aggregate: MAX
            label: risk_sort_score
        group_by:
          - ward
          - risk_level_badge
          - executive_priority_badge
          - issue_badge
          - required_action_badge
          - owner_badge
          - target_time_badge
          - current_occupancy_pct
          - available_beds
        row_limit: 25
        sort_desc: true
        query_overrides:
          orderby:
            - - expressionType: SIMPLE
                column:
                  column_name: risk_sort_score
                  type: NUMERIC
                aggregate: MAX
                label: risk_sort_score
                optionName: metric_risk_sort_score
              - false
        form_data:
          allow_render_html: true
          color_scheme: supersetColors
          show_cell_bars: true
          color_pn: false
          column_config:
            executive_priority_badge:
              columnWidth: 190
            required_action_badge:
              columnWidth: 220
            current_occupancy_pct:
              d3NumberFormat: ".1f"
              showCellBars: true
              columnWidth: 170
            available_beds:
              d3NumberFormat: ".0f"
              showCellBars: true
              columnWidth: 150
            risk_sort_score:
              columnWidth: 1
      - key: ward_pressure_bubble
        enabled: true
        title: Ward Pressure Bubble Map
        viz_type: bubble_v2
        layout:
          x: 0
          y: 55
          w: 6
          h: 14
        dataset: analytics.fct_bed_pressure_latest_snapshot
        bubble_entity: ward
        bubble_series: specialty
        bubble_order_metric: size
        bubble_x:
          name: admissions_today
          column: admissions_today
          aggregate: MAX
          label: Admissions Today
        bubble_y:
          name: occupancy_rate_pct
          column: occupancy_rate_pct
          aggregate: MAX
          label: Occupancy %
        bubble_size:
          name: occupied_beds
          column: occupied_beds
          aggregate: MAX
          label: Occupied Beds
        row_limit: 50
        sort_desc: true
        form_data:
          color_scheme: supersetColors
          showLegend: true
          maxBubbleSize: "42"
          xAxisFormat: ".0f"
          yAxisFormat: ".1f"
          tooltipSizeFormat: ".0f"
          opacity: 0.85
      - key: specialty_occupancy_boxplot
        enabled: true
        title: Specialty Occupancy Distribution
        viz_type: box_plot
        layout:
          x: 6
          y: 55
          w: 6
          h: 14
        dataset: analytics.fct_bed_pressure_distribution
        metrics:
          - name: occupancy_rate_pct
            column: occupancy_rate_pct
            aggregate: AVG
            label: Occupancy %
        group_by:
          - specialty
        columns:
          - date_day
        time_column: date_day
        time_range: "{latest_30d_range}"
        row_limit: 500
        sort_desc: true
        whisker_type: tukey
        form_data:
          color_scheme: supersetColors
          numberFormat: ".1f"
          whiskerOptions: Tukey
          xTicksLayout: "45°"
          xAxisTitle: Specialty
          yAxisTitle: Occupancy %
      - key: capacity_treemap
        enabled: true
        title: Capacity Mix Treemap
        viz_type: treemap_v2
        layout:
          x: 0
          y: 69
          w: 12
          h: 14
        dataset: analytics.fct_bed_pressure_latest_snapshot
        metrics:
          - name: occupied_beds
            column: occupied_beds
            aggregate: MAX
            label: Occupied Beds
        group_by:
          - specialty
          - ward
        row_limit: 100
        sort_by_metric: true
        form_data:
          color_scheme: supersetColors
          numberFormat: ".0f"
          showLabels: true
          showUpperLabels: true
          labelType: key_value

  staff_scheduling:
    enabled: false
    use_case: staff_scheduling
    dashboard_id: staff-utilization
    title: Staff Scheduling Pressure
    schema: analytics
    datasets:
      - analytics.staffing_pressure_daily
    filters:
      - key: ward
        type: native_filter
        label: Ward
        target_dataset: analytics.staffing_pressure_daily
        column: ward_id
        control: multi_select
        searchable: true
    charts:
      - key: staffing_pressure_trend
        enabled: true
        title: Staffing Pressure Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 0
          w: 12
          h: 14
        dataset: analytics.staffing_pressure_daily
        metrics:
          - staffing_pressure_index
        time_column: date_day
  revenue_cycle_management:
    enabled: true
    use_case: revenue_cycle_management
    dashboard_id: revenue-cycle-management
    title: Hospital Revenue Cycle CFO Command Centre
    schema: analytics
    filter_bar_orientation: HORIZONTAL
    markdowns:
      - key: executive_header
        layout:
          x: 0
          y: 0
          w: 12
          h: 6
        code: |
          # Hospital Revenue Cycle CFO Command Centre

          _Executive view of revenue, cash collection, receivables, payer performance, denials, billing leakage, and financial risk across the hospital network._

          **Executive summary**
          Month-to-date collections are tracking below target, with revenue risk concentrated in denied claims, aged receivables, unbilled discharges, and payer delays. Immediate CFO attention should focus on high-value denied claims, A/R over 90 days, DNFB backlog, and underperforming payers.
    datasets:
      - analytics.fct_cash_forecast
      - analytics.fct_revenue_cycle
      - analytics.fct_denials
      - analytics.fct_cash_recovery_opportunity
      - analytics.fct_revenue_leakage
      - analytics.fct_claim_aging
      - analytics.fct_payer_contract_performance
    dataset_column_labels:
      analytics.fct_revenue_cycle:
        payer_id: Payer
        department_id: Department / Specialty
        claim_status: Claim Status
        gross_billed_amount: Gross Charges
        contracted_amount: Net Patient Revenue
        expected_cash_amount: Net Revenue
        posted_cash_amount: Cash Collected
        ar_days: AR Days
      analytics.fct_cash_forecast:
        forecast_date: Forecast Date
        payer_id: Payer
        department_id: Department / Specialty
        expected_cash: Expected Cash
        recoverable_cash: Recoverable Cash
        cash_at_risk: Revenue At Risk
        confidence_score: Forecast Confidence
      analytics.fct_claim_aging:
        payer_id: Payer
        department_id: Department / Specialty
        aging_bucket_label: A/R Aging Bucket
        aging_bucket_days: A/R Aging Days
        outstanding_amount: Outstanding A/R
        claim_status: Claim Status
      analytics.fct_denials:
        payer_id: Payer
        department_id: Department / Specialty
        denial_date: Denial Date
        denial_reason: Denial Root Cause
        denied_amount: Denied Value
        appeal_status: Appeal Status
        claim_status: Claim Status
      analytics.fct_revenue_leakage:
        payer_id: Payer
        department_id: Department / Specialty
        detected_date: Detection Date
        leakage_type: Leakage Type
        leakage_reason: Leakage Reason
        leakage_amount: Leakage Value
        owner_team: Owner
        status: Status
      analytics.fct_payer_contract_performance:
        payer_id: Payer
        month_key: Month
        paid_amount: Cash Collected
        underpayment_amount: Underpayment Value
        actual_collection_rate: Collection Rate
        contract_rate_pct: Contract Rate
        actual_payment_days: Payment Lag
        payment_sla_days: Payment SLA Days
        sla_breach_count: SLA Breaches
        contract_breach_flag: Contract Breach
        renegotiation_flag: Renegotiation Flag
      analytics.fct_cash_recovery_opportunity:
        payer_id: Payer
        department_id: Department / Specialty
        area: Area
        risk_level_badge: Risk Level
        executive_priority_badge: Executive Priority
        revenue_at_risk: Revenue At Risk
        root_cause: Root Cause
        required_action: Required Action
        owner_badge: Owner
        target_date_display: Target Date
        status_badge: Status
        risk_sort_score: risk_sort_score
    filters:
      - key: date_range
        type: native_filter
        label: Date / Month
        target_datasets:
          - analytics.fct_revenue_cycle
          - analytics.fct_denials
          - analytics.fct_cash_forecast
          - analytics.fct_revenue_leakage
          - analytics.fct_claim_aging
          - analytics.fct_payer_contract_performance
          - analytics.fct_cash_recovery_opportunity
        columns_by_dataset:
          analytics.fct_revenue_cycle: claim_date
          analytics.fct_denials: denial_date
          analytics.fct_cash_forecast: forecast_date
          analytics.fct_revenue_leakage: detected_date
          analytics.fct_claim_aging: snapshot_date
          analytics.fct_payer_contract_performance: month_key
          analytics.fct_cash_recovery_opportunity: detected_date
        column: claim_date
        control: date_range
        default: No filter
        presets:
          - 30d
          - 90d
          - 180d
      - key: payer
        type: native_filter
        label: Payer
        target_datasets:
          - analytics.fct_revenue_cycle
          - analytics.fct_denials
          - analytics.fct_cash_forecast
          - analytics.fct_revenue_leakage
          - analytics.fct_claim_aging
          - analytics.fct_payer_contract_performance
          - analytics.fct_cash_recovery_opportunity
        column: payer_id
        control: multi_select
        searchable: true
      - key: department
        type: native_filter
        label: Department / Specialty
        target_datasets:
          - analytics.fct_revenue_cycle
          - analytics.fct_denials
          - analytics.fct_cash_forecast
          - analytics.fct_revenue_leakage
          - analytics.fct_claim_aging
          - analytics.fct_cash_recovery_opportunity
        column: department_id
        control: multi_select
        searchable: true
      - key: claim_status
        type: native_filter
        label: Claim Status
        target_datasets:
          - analytics.fct_revenue_cycle
          - analytics.fct_claim_aging
          - analytics.fct_denials
        columns_by_dataset:
          analytics.fct_revenue_cycle: claim_status
          analytics.fct_claim_aging: claim_status
          analytics.fct_denials: claim_status
        column: claim_status
        control: multi_select
        searchable: true
    charts:
      - key: net_patient_revenue
        enabled: true
        title: Net Patient Revenue (SAR)
        viz_type: big_number
        layout:
          x: 0
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_revenue_cycle
        metrics:
          - contracted_amount_sum
        time_column: claim_date
        row_limit: 180
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous period
          subheader: "SAR - billed after contractual adjustment"
          y_axis_format: ",.2s"
          colorPicker:
            r: 23
            g: 51
            b: 107
            a: 1
          color_scheme: supersetColors
      - key: cash_collected
        enabled: true
        title: Cash Collected (SAR)
        viz_type: big_number
        layout:
          x: 2
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_revenue_cycle
        metrics:
          - posted_cash_amount_sum
        time_column: claim_date
        row_limit: 180
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous period
          subheader: "SAR - strong when trending toward target"
          y_axis_format: ",.2s"
          colorPicker:
            r: 22
            g: 101
            b: 52
            a: 1
          color_scheme: supersetColors
      - key: collection_rate
        enabled: true
        title: Collection Rate
        viz_type: big_number
        layout:
          x: 4
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_revenue_cycle
        metrics:
          - name: collection_rate
            expressionType: SQL
            sqlExpression: "sum(posted_cash_amount) / nullif(sum(expected_cash_amount), 0)"
            label: Collection Rate
        time_column: claim_date
        row_limit: 180
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous period
          subheader: "Healthy >= 80% - Watch 70-79% - Critical < 70%"
          y_axis_format: ".1%"
          colorPicker:
            r: 8
            g: 89
            b: 120
            a: 1
          color_scheme: supersetColors
      - key: ar_days
        enabled: true
        title: AR Days
        viz_type: big_number
        layout:
          x: 6
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_revenue_cycle
        metrics:
          - ar_days_avg
        time_column: claim_date
        row_limit: 180
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous period
          subheader: "Healthy <= 55 - Watch 56-70 - Critical > 70"
          y_axis_format: ".0f"
          colorPicker:
            r: 146
            g: 64
            b: 14
            a: 1
          color_scheme: supersetColors
      - key: denial_rate
        enabled: true
        title: Denial Rate
        viz_type: big_number
        layout:
          x: 8
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_revenue_cycle
        metrics:
          - name: denial_rate
            expressionType: SQL
            sqlExpression: "sum(case when claim_status in ('denied','appealed','writeoff') then greatest(expected_cash_amount - posted_cash_amount, gross_billed_amount * 0.35) else 0 end) / nullif(sum(gross_billed_amount), 0)"
            label: Denial Rate
        time_column: claim_date
        row_limit: 180
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous period
          subheader: "Healthy <= 5% - Watch 5-8% - Critical > 8%"
          y_axis_format: ".1%"
          colorPicker:
            r: 153
            g: 27
            b: 27
            a: 1
          color_scheme: supersetColors
      - key: revenue_at_risk
        enabled: true
        title: Revenue At Risk (SAR)
        viz_type: big_number
        layout:
          x: 10
          y: 6
          w: 2
          h: 8
        dataset: analytics.fct_cash_recovery_opportunity
        metrics:
          - recoverable_amount_sum
        time_column: detected_date
        row_limit: 180
        form_data:
          showTrendLine: true
          showTimestamp: false
          compareLag: 1
          compareSuffix: vs previous period
          subheader: "Denied, aged, delayed, and underpaid cash exposure"
          y_axis_format: ",.2s"
          colorPicker:
            r: 127
            g: 29
            b: 29
            a: 1
          color_scheme: supersetColors
      - key: cash_forecast_and_risk
        enabled: true
        title: Revenue vs Cash Collection Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 14
