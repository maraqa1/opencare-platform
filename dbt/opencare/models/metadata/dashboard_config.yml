version: 1

dashboards:
  bed_pressure:
    enabled: true
    use_case: bed_pressure
    dashboard_id: bed-occupancy-trends
    title: Bed Occupancy Intelligence
    schema: analytics
    datasets:
      - analytics.fct_bed_pressure_daily_summary
      - analytics.fct_bed_pressure_latest_summary
      - analytics.fct_bed_pressure_latest_snapshot
    filters:
      - key: ward
        type: native_filter
        label: Ward
        target_dataset: analytics.fct_bed_pressure_latest_snapshot
        column: ward_name
        control: multi_select
        searchable: true
        chart_scope:
          - pressure_mix
          - ward_ranking
      - key: date_range
        type: native_filter
        label: Date Range
        target_dataset: analytics.fct_bed_pressure_daily_summary
        column: date_day
        control: date_range
        default: Last 90 days
        presets:
          - 30d
          - 90d
          - 180d
        chart_scope:
          - network_occupancy_trend
          - admissions_vs_discharges
    charts:
      - key: network_occupancy
        enabled: true
        title: Network Occupancy
        viz_type: big_number_total
        layout:
          x: 0
          y: 0
          w: 3
          h: 7
        dataset: analytics.fct_bed_pressure_latest_summary
        metrics:
          - network_occupancy_rate_pct
        form_data:
          subheader: Latest staffed-bed occupancy %
          show_timestamp: false
          y_axis_format: ".1f"
          color_scheme: supersetColors
      - key: available_beds
        enabled: true
        title: Available Beds
        viz_type: big_number_total
        layout:
          x: 3
          y: 0
          w: 3
          h: 7
        dataset: analytics.fct_bed_pressure_latest_summary
        metrics:
          - network_available_beds
        form_data:
          subheader: Latest network open capacity
          show_timestamp: false
          y_axis_format: ".0f"
          color_scheme: d3Category20
      - key: critical_wards
        enabled: true
        title: Critical Wards
        viz_type: big_number_total
        layout:
          x: 6
          y: 0
          w: 3
          h: 7
        dataset: analytics.fct_bed_pressure_latest_summary
        metrics:
          - critical_ward_count
        form_data:
          subheader: Wards at or above 90% occupancy
          show_timestamp: false
          y_axis_format: ".0f"
          color_scheme: fire
      - key: warning_wards
        enabled: true
        title: Warning Wards
        viz_type: big_number_total
        layout:
          x: 9
          y: 0
          w: 3
          h: 7
        dataset: analytics.fct_bed_pressure_latest_summary
        metrics:
          - warning_ward_count
        form_data:
          subheader: Wards between 75% and 90%
          show_timestamp: false
          y_axis_format: ".0f"
          color_scheme: preswald
      - key: network_occupancy_trend
        enabled: true
        title: Network Occupancy Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 7
          w: 8
          h: 14
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - network_occupancy_rate_pct
          - peak_ward_occupancy_pct
        time_column: date_day
        row_limit: 180
        form_data:
          x_axis_time_format: smart_date
          y_axis_format: ".0f"
          color_scheme: supersetColors
          show_legend: true
          rich_tooltip: true
      - key: pressure_mix
        enabled: true
        title: Current Pressure Mix
        viz_type: pie
        layout:
          x: 8
          y: 7
          w: 4
          h: 14
        dataset: analytics.fct_bed_pressure_latest_snapshot
        metrics:
          - ward_row_count
        group_by:
          - pressure_band
        row_limit: 20
        form_data:
          donut: true
          show_legend: true
          label_type: key_value
          color_scheme: supersetColors
          number_format: ".0f"
      - key: ward_ranking
        enabled: true
        title: Highest Occupancy Wards
        viz_type: dist_bar
        layout:
          x: 0
          y: 21
          w: 6
          h: 13
        dataset: analytics.fct_bed_pressure_latest_snapshot
        metrics:
          - occupancy_rate_pct
        group_by:
          - ward_name
        row_limit: 12
        sort_desc: true
        form_data:
          show_legend: false
          color_scheme: supersetColors
          y_axis_format: ".0f"
          truncate_metric: false
          sort_by_metric: true
      - key: admissions_vs_discharges
        enabled: true
        title: Admissions vs Discharges
        viz_type: echarts_area
        layout:
          x: 6
          y: 21
          w: 6
          h: 13
        dataset: analytics.fct_bed_pressure_daily_summary
        metrics:
          - admissions_total
          - discharges_total
        time_column: date_day
        row_limit: 180
        form_data:
          color_scheme: d3Category20
          show_legend: true
          x_axis_time_format: smart_date
          y_axis_format: ".0f"

  staff_scheduling:
    enabled: false
    use_case: staff_scheduling
    dashboard_id: staff-utilization
    title: Staff Scheduling Pressure
    schema: analytics
    datasets:
      - analytics.staffing_pressure_daily
    filters:
      - key: ward
        type: native_filter
        label: Ward
        target_dataset: analytics.staffing_pressure_daily
        column: ward_id
        control: multi_select
        searchable: true
    charts:
      - key: staffing_pressure_trend
        enabled: true
        title: Staffing Pressure Trend
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 0
          w: 12
          h: 14
        dataset: analytics.staffing_pressure_daily
        metrics:
          - staffing_pressure_index
        time_column: date_day
  revenue_cycle_management:
    enabled: true
    use_case: revenue_cycle_management
    dashboard_id: revenue-cycle-management
    title: Revenue Cycle Executive Command
    schema: analytics
    datasets:
      - analytics.fct_cash_forecast
      - analytics.fct_revenue_cycle
      - analytics.fct_denials
      - analytics.fct_cash_recovery_opportunity
      - analytics.fct_revenue_leakage
      - analytics.fct_claim_aging
      - analytics.fct_payer_contract_performance
      - analytics.fct_team_recovery_performance
    filters:
      - key: payer
        type: native_filter
        label: Payer
        target_dataset: analytics.fct_revenue_cycle
        column: payer_id
        control: multi_select
        searchable: true
      - key: department
        type: native_filter
        label: Department
        target_dataset: analytics.fct_revenue_cycle
        column: department_id
        control: multi_select
        searchable: true
      - key: date_range
        type: native_filter
        label: Date Range
        target_dataset: analytics.fct_revenue_cycle
        column: claim_date
        control: date_range
        default: No filter
        presets:
          - 30d
          - 90d
          - 180d
      - key: owner_team
        type: native_filter
        label: Owner Team
        target_dataset: analytics.fct_cash_recovery_opportunity
        column: owner_team
        control: multi_select
        searchable: true
    charts:
      - key: executive_cash_position
        enabled: true
        title: Executive Cash Position
        viz_type: table
        layout:
          x: 0
          y: 0
          w: 12
          h: 8
        dataset: analytics.fct_cash_forecast
        metrics:
          - expected_cash_sum
          - recoverable_cash_sum
          - cash_at_risk_sum
          - confidence_score_avg
      - key: cash_forecast_and_risk
        enabled: true
        title: Expected Cash and Risk Outlook
        viz_type: echarts_area
        layout:
          x: 0
          y: 8
          w: 8
          h: 12
        dataset: analytics.fct_cash_forecast
        metrics:
          - expected_cash_sum
          - recoverable_cash_sum
          - cash_at_risk_sum
        time_column: forecast_date
        row_limit: 180
      - key: ar_exposure_by_claim_status
        enabled: true
        title: Open A/R Exposure by Claim Status
        viz_type: dist_bar
        layout:
          x: 8
          y: 8
          w: 4
          h: 12
        dataset: analytics.fct_claim_aging
        metrics:
          - outstanding_amount_sum
        group_by:
          - claim_status
      - key: billed_vs_collected_trend
        enabled: true
        title: Gross Charges vs Posted Cash
        viz_type: echarts_timeseries_line
        layout:
          x: 0
          y: 20
          w: 8
          h: 12
        dataset: analytics.fct_revenue_cycle
        metrics:
          - gross_billed_amount_sum
          - posted_cash_amount_sum
        time_column: claim_date
        row_limit: 180
      - key: denial_pressure_over_time
        enabled: true
        title: Denial Pressure Over Time
        viz_type: echarts_timeseries_bar
        layout:
          x: 8
          y: 20
          w: 4
          h: 12
        dataset: analytics.fct_denials
        metrics:
          - denied_amount_sum
        group_by:
          - denial_reason
        time_column: denial_date
        row_limit: 180
      - key: underpayment_exposure_by_payer
        enabled: true
        title: Underpayment Exposure by Payer
        viz_type: dist_bar
        layout:
          x: 0
          y: 32
          w: 6
          h: 12
        dataset: analytics.fct_payer_contract_performance
        metrics:
          - underpayment_amount_sum
        group_by:
          - payer_id
      - key: payer_collection_vs_contract
        enabled: true
        title: Payer Collection Rate vs Contract
        viz_type: dist_bar
        layout:
          x: 6
          y: 32
          w: 6
          h: 12
        dataset: analytics.fct_payer_contract_performance
        metrics:
          - actual_collection_rate_avg
          - contract_rate_pct_avg
        group_by:
          - payer_id
      - key: leakage_concentration_by_type
        enabled: true
        title: Revenue Leakage Concentration
        viz_type: dist_bar
        layout:
          x: 0
          y: 44
          w: 6
          h: 12
        dataset: analytics.fct_revenue_leakage
        metrics:
          - leakage_amount_sum
        group_by:
          - leakage_type
      - key: team_recovery_vs_target
        enabled: true
        title: Team Recovery vs Expected Value
        viz_type: dist_bar
        layout:
          x: 6
          y: 44
          w: 6
          h: 12
        dataset: analytics.fct_team_recovery_performance
        metrics:
          - actual_recovery_sum
          - expected_recovery_sum
        group_by:
          - owner_team
      - key: executive_recovery_actions
        enabled: true
        title: Executive Recovery Actions This Week
        viz_type: table
        layout:
          x: 0
          y: 56
          w: 12
          h: 12
        dataset: analytics.fct_cash_recovery_opportunity
        metrics:
          - recoverable_amount_sum
          - expected_recovery_amount_sum
          - priority_score_avg
        group_by:
          - issue_type
          - owner_team
