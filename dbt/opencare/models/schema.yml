version: 2

models:
  - name: stg_wards
    description: Standardized ward dimension inputs shaped from Airbyte-loaded raw ward records.
    columns:
      - name: ward_id
        tests:
          - not_null
          - unique
      - name: ward_code
        tests:
          - not_null
          - unique
      - name: ward_name
        tests:
          - not_null

  - name: stg_patients
    description: Standardized patient reference inputs for downstream healthcare analytics use cases.
    columns:
      - name: patient_id
        tests:
          - not_null
          - unique
      - name: medical_record_number
        tests:
          - not_null
          - unique

  - name: stg_bed_events
    description: Standardized bed occupancy and movement event records.
    columns:
      - name: bed_event_key
        tests:
          - not_null
          - unique
      - name: ward_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_wards')
              field: ward_id
      - name: patient_id
        tests:
          - relationships:
              to: ref('stg_patients')
              field: patient_id
              where: "patient_id is not null"
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['midnight_census', 'admission', 'discharge', 'transfer_in', 'transfer_out']
      - name: event_date
        tests:
          - not_null
      - name: occupied_beds
        tests:
          - not_null

  - name: dim_ward
    description: Analytics ward dimension for operational reporting and runtime joins.
    columns:
      - name: ward_id
        tests:
          - not_null
          - unique
      - name: ward_code
        tests:
          - not_null
          - unique
      - name: ward_name
        tests:
          - not_null

  - name: dim_date
    description: Analytics date dimension derived from the bed occupancy event calendar.
    columns:
      - name: date_day
        tests:
          - not_null
          - unique

  - name: fct_bed_occupancy
    description: Daily ward-level occupancy fact used by forecasting and anomaly detection.
    columns:
      - name: occupancy_fact_key
        tests:
          - not_null
          - unique
      - name: date_day
        tests:
          - not_null
      - name: ward_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_ward')
              field: ward_id
      - name: occupancy_rate
        tests:
          - not_null

  - name: dict_metrics
    description: Dictionary metrics reference for the Hospital Bed Occupancy Intelligence demo.
    columns:
      - name: metric_id
        tests:
          - not_null
          - unique
      - name: metric_name
        tests:
          - not_null
      - name: metric_schema
        tests:
          - not_null

  - name: fact_bed_occupancy
    description: Compatibility alias for runtime consumers that still read analytics.fact_bed_occupancy.
    columns:
      - name: occupancy_fact_key
        tests:
          - not_null
          - unique

  - name: dim_department
    description: Compatibility alias for runtime consumers that still read analytics.dim_department.
    columns:
      - name: department_id
        tests:
          - not_null
          - unique

  - name: dim_time
    description: Compatibility alias for runtime consumers that still read analytics.dim_time.
    columns:
      - name: date_day
        tests:
          - not_null
          - unique

  - name: fact_capacity
    description: Daily ward capacity fact retained for runtime compatibility and capacity KPI calculations.
    columns:
      - name: capacity_fact_key
        tests:
          - not_null
          - unique
