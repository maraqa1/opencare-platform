version: 2

sources:
  - name: raw
    description: Operational landing schema populated by Airbyte from the external hospital MySQL source.
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', env_var('RAW_SCHEMA', 'raw')) }}"
    freshness:
      warn_after: {count: 2, period: hour}
      error_after: {count: 4, period: hour}
    meta:
      stage: source
      classification: operational
      system_of_record: hospital_mysql
      owner: Capacity Management
      retention_days: 2555
    tables:
      - name: wards
        description: Raw ward reference records from the source system.
        loaded_at_field: updated_at
        meta:
          classification: reference
          contains_pii: false
        columns:
          - name: ward_id
            description: Unique identifier assigned to a ward in the hospital source system.
            tests:
              - not_null
          - name: ward_code
            description: Human-friendly ward code used in operational reporting.
            tests:
              - not_null
          - name: ward_name
            description: Descriptive ward name displayed to operations teams.
            tests:
              - not_null

      - name: patients
        description: Raw patient reference records from the source system.
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 4, period: hour}
          error_after: {count: 8, period: hour}
        meta:
          classification: patient_identifiable
          contains_pii: true
          retention_days: 2555
        columns:
          - name: patient_id
            description: Internal patient identifier from the source system.
            meta:
              contains_pii: true
              pii_level: HIGH
            tests:
              - not_null
          - name: medical_record_number
            description: Medical record number assigned to the patient.
            meta:
              contains_pii: true
              pii_level: HIGH
            tests:
              - not_null

      - name: bed_events
        description: Raw ward occupancy and movement events from the source system.
        loaded_at_field: event_timestamp
        meta:
          classification: operational
          contains_pii: false
          freshness_sla_hours: 2
        columns:
          - name: event_id
            description: Source event identifier for a bed movement record.
            tests:
              - not_null
          - name: event_timestamp
            description: Timestamp when the event was recorded in the source system.
            tests:
              - not_null
          - name: ward_id
            description: Ward identifier attached to the bed event.
            tests:
              - not_null
          - name: event_type
            description: Event category such as admission, discharge, or midnight census.
            tests:
              - not_null
      - name: rcm_claims
        description: Raw revenue cycle claims used to drive recovery, payer, and cash-control marts.
        loaded_at_field: updated_at
        meta:
          classification: financial
          contains_pii: false
          freshness_sla_hours: 8
        columns:
          - name: claim_id
            tests:
              - not_null
          - name: encounter_id
            tests:
              - not_null
          - name: payer_id
            tests:
              - not_null
          - name: department_id
            tests:
              - not_null
          - name: claim_date
            tests:
              - not_null
          - name: claim_status
            tests:
              - not_null

      - name: rcm_financial_postings
        description: Raw ERP posting rows used as the financial truth anchor for revenue-cycle reconciliation.
        loaded_at_field: posting_date
        meta:
          classification: financial
          contains_pii: false
          freshness_sla_hours: 8
        columns:
          - name: posting_id
            tests:
              - not_null
          - name: claim_id
            tests:
              - not_null
          - name: encounter_id
            tests:
              - not_null
          - name: posting_date
            tests:
              - not_null
          - name: posting_type
            tests:
              - not_null

      - name: rcm_referrals
        description: Raw referral and acquisition rows linking encounters to channel performance.
        loaded_at_field: referral_date
        meta:
          classification: commercial
          contains_pii: false
          freshness_sla_hours: 24
        columns:
          - name: referral_id
            tests:
              - not_null
          - name: encounter_id
            tests:
              - not_null
          - name: acquisition_channel
            tests:
              - not_null
          - name: referral_source
            tests:
              - not_null
          - name: referral_date
            tests:
              - not_null
