schema_version: "1.0"
slug: bed-pressure
name: Bed Pressure Intelligence
domain: Clinical Operations
maturity: in_progress
ownership:
  owner: Clinical Operations Analytics
  steward: Capacity Planning Lead
  review_cadence: monthly
source_systems:
  - id: emr
    name: EMR
    system_type: clinical
  - id: adt
    name: ADT
    system_type: operational
governed_tables:
  - id: analytics.fct_bed_occupancy
    schema: analytics
    table: fct_bed_occupancy
    stage: analytics
    purpose: Daily ward occupancy fact used by bed pressure reporting.
    attributes:
      - name: patient_id
        business_name: Patient ID
        data_type: text
        description: Source-system patient identifier used for occupancy joins.
        semantic_terms:
          - patient identifier
        review_status: pending
      - name: ward_code
        business_name: Ward Code
        data_type: text
        description: Operational ward code used to group bed occupancy.
        semantic_terms:
          - operational code
        review_status: approved
      - name: occupied_beds
        business_name: Occupied Beds
        data_type: integer
        description: Count of occupied staffed beds in the reporting interval.
        review_status: pending
  - id: output.forecast
    schema: output
    table: forecast
    stage: output
    purpose: Forecast runtime output for ward pressure prediction.
    attributes:
      - name: ward_code
        business_name: Ward Code
        data_type: text
        description: Operational ward code for the predicted occupancy record.
        semantic_terms:
          - operational code
        review_status: approved
      - name: predicted_occupancy_rate
        business_name: Predicted Occupancy Rate
        data_type: numeric
        description: Forecast occupancy rate generated by the runtime output.
        review_status: pending
kpis:
  - id: current-occupancy-rate
    name: Current Occupancy Rate
    definition: Percentage of staffed beds occupied during the reporting interval.
    formula: occupied_beds / staffed_beds * 100
    owner: Capacity Planning Lead
    source_table: analytics.fct_bed_occupancy
    consumers:
      - Bed Pressure workspace
      - Superset bed occupancy dashboard
policies_in_scope:
  - healthcare-default
consumers:
  - id: bed-pressure-workspace
    type: portal
    name: Bed Pressure workspace
  - id: bed-occupancy-dashboard
    type: dashboard
    name: Superset bed occupancy dashboard
freshness:
  sla: 2 hours
  critical_tables:
    - analytics.fct_bed_occupancy
evidence:
  dbt_project: opencare
  expected_dbt_models:
    - fct_bed_occupancy
  expected_outputs:
    - output.forecast
