---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-server
  namespace: opencare
spec:
  selector:
    app: airbyte-server
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-server
  namespace: opencare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airbyte-server
  template:
    metadata:
      labels:
        app: airbyte-server
    spec:
      containers:
        - name: airbyte-server
          image: airbyte/server:build-8301b7db38-22827-master
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: opencare-config
            - secretRef:
                name: opencare-secrets
          env:
            - name: AIRBYTE_ROLE
              value: server
            - name: AIRBYTE_WORKSPACE_ROOT
              value: /data/workspace
            - name: STORAGE_TYPE
              value: MINIO
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: MINIO_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: MINIO_REGION
            - name: S3_PATH_STYLE_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_S3_PATH_STYLE
            - name: S3_MINIO_ENDPOINT
              value: http://minio.opencare.svc.cluster.local:9000
            - name: AIRBYTE_MINIO_ENDPOINT
              value: http://minio.opencare.svc.cluster.local:9000
            - name: MINIO_SSL
              value: "false"
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/opencare
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: airbyte-data
              mountPath: /data
      volumes:
        - name: airbyte-data
          emptyDir: {}
