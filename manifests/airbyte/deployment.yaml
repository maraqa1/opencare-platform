---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-temporal
  namespace: opencare
spec:
  selector:
    app: airbyte-temporal
  ports:
    - name: grpc
      protocol: TCP
      port: 7233
      targetPort: 7233
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airbyte-temporal-dynamic-config
  namespace: opencare
data:
  development-sql.yaml: |
    frontend.enableClientVersionCheck:
      - value: true
        constraints: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-temporal
  namespace: opencare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airbyte-temporal
  template:
    metadata:
      labels:
        app: airbyte-temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.27.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7233
              name: grpc
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: POSTGRES_PORT
            - name: POSTGRES_SEEDS
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: POSTGRES_HOST
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: POSTGRES_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: POSTGRES_DB
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/config/dynamicconfig/development-sql.yaml
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: temporal-dynamic-config
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
      volumes:
        - name: temporal-dynamic-config
          configMap:
            name: airbyte-temporal-dynamic-config
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-server
  namespace: opencare
spec:
  selector:
    app: airbyte-server
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbyte-server
  namespace: opencare
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: airbyte-server
  template:
    metadata:
      labels:
        app: airbyte-server
    spec:
      containers:
        - name: airbyte-server
          image: airbyte/server:build-8301b7db38-22827-master
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: opencare-config
            - secretRef:
                name: opencare-secrets
          env:
            - name: AIRBYTE_ROLE
              value: server
            - name: AIRBYTE_WORKSPACE_ROOT
              value: /data/workspace
            - name: AIRBYTE_CLOUD_STORAGE_BUCKET_LOG
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_BUCKET_LOG
            - name: AIRBYTE_CLOUD_STORAGE_BUCKET_STATE
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_BUCKET_STATE
            - name: AIRBYTE_CLOUD_STORAGE_BUCKET_WORKLOAD_OUTPUT
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_BUCKET_WORKLOAD_OUTPUT
            - name: AIRBYTE_CLOUD_STORAGE_BUCKET_ACTIVITY_PAYLOAD
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_BUCKET_ACTIVITY_PAYLOAD
            - name: AIRBYTE_CLOUD_STORAGE_BUCKET_AUDIT_LOGGING
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_BUCKET_AUDIT_LOGGING
            - name: AIRBYTE_CLOUD_STORAGE_BUCKET_PROFILER_OUTPUT
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_BUCKET_PROFILER_OUTPUT
            - name: AIRBYTE_CONNECTOR_REGISTRY_ENTERPRISE_ENTERPRISE_SOURCE_STUBS_URL
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_ENTERPRISE_SOURCE_STUBS_URL
            - name: AIRBYTE_CONNECTOR_REGISTRY_ENTERPRISE_ENTERPRISE_DESTINATION_STUBS_URL
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_ENTERPRISE_DESTINATION_STUBS_URL
            - name: AIRBYTE_CONNECTOR_REGISTRY_ENTERPRISE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_CONNECTOR_REGISTRY_ENTERPRISE_ENABLED
            - name: TEMPORAL_HOST
              value: airbyte-temporal:7233
            - name: STORAGE_TYPE
              value: MINIO
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: MINIO_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: MINIO_REGION
            - name: S3_PATH_STYLE_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: AIRBYTE_S3_PATH_STYLE
            - name: S3_MINIO_ENDPOINT
              value: http://minio.opencare.svc.cluster.local:9000
            - name: AIRBYTE_MINIO_ENDPOINT
              value: http://minio.opencare.svc.cluster.local:9000
            - name: MINIO_SSL
              value: "false"
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/opencare
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: opencare-config
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: POSTGRES_PASSWORD
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: airbyte-data
              mountPath: /data
      volumes:
        - name: airbyte-data
          emptyDir: {}
