          key: aws-region
    - name: AWS_DEFAULT_REGION
      valueFrom:
        secretKeyRef:
          name: __AIRBYTE_SECRET_NAME__
          key: aws-region
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: __AIRBYTE_SECRET_NAME__
          key: aws-s3-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: __AIRBYTE_SECRET_NAME__
          key: aws-s3-secret-access-key

