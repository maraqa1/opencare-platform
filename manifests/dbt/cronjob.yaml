---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbt-runner
  namespace: opencare
spec:
  schedule: "10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dbt
              image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command:
                - /bin/sh
                - -c
                - |
                  mkdir -p /root/.dbt /workspace && \
                  cp -R /workspace-src/. /workspace/ && \
                  cp /config/profiles.yml /root/.dbt/profiles.yml && \
                  DBT_ARGS="" && \
                  if [ -n "${DBT_SELECT:-}" ]; then DBT_ARGS="$DBT_ARGS --select ${DBT_SELECT}"; fi && \
                  if [ -n "${DBT_EXCLUDE:-}" ]; then DBT_ARGS="$DBT_ARGS --exclude ${DBT_EXCLUDE}"; fi && \
                  dbt deps --project-dir /workspace || true && \
                  dbt run --project-dir /workspace $DBT_ARGS && \
                  dbt test --project-dir /workspace $DBT_ARGS
              env:
                - name: DBT_EXCLUDE
                  value: tag:talemia
              envFrom:
                - configMapRef:
                    name: opencare-config
                - secretRef:
                    name: opencare-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - name: dbt-project-src
                  mountPath: /workspace-src
                  readOnly: true
                - name: dbt-workspace
                  mountPath: /workspace
                - name: dbt-profile
                  mountPath: /config
          volumes:
            - name: dbt-project-src
              configMap:
                name: dbt-project-files
                items:
                  - key: dbt_project.yml
                    path: dbt_project.yml
                  - key: generate_schema_name.sql
                    path: macros/generate_schema_name.sql
                  - key: test_expression_is_true.sql
                    path: macros/test_expression_is_true.sql
                  - key: talemia_raw_relation.sql
                    path: macros/talemia_raw_relation.sql
                  - key: sources.yml
                    path: models/sources.yml
                  - key: schema.yml
                    path: models/schema.yml
                  - key: stg_wards.sql
                    path: models/staging/stg_wards.sql
                  - key: stg_patients.sql
                    path: models/staging/stg_patients.sql
                  - key: stg_bed_events.sql
                    path: models/staging/stg_bed_events.sql
                  - key: stg_departments.sql
                    path: models/staging/stg_departments.sql
                  - key: dim_ward.sql
                    path: models/marts/dim_ward.sql
                  - key: dim_date.sql
                    path: models/marts/dim_date.sql
                  - key: fct_bed_occupancy.sql
                    path: models/marts/fct_bed_occupancy.sql
                  - key: fct_bed_pressure_daily_summary.sql
                    path: models/marts/fct_bed_pressure_daily_summary.sql
                  - key: fct_bed_pressure_latest_summary.sql
                    path: models/marts/fct_bed_pressure_latest_summary.sql
                  - key: fct_bed_pressure_latest_snapshot.sql
                    path: models/marts/fct_bed_pressure_latest_snapshot.sql
                  - key: fact_bed_occupancy.sql
                    path: models/marts/fact_bed_occupancy.sql
                  - key: fact_capacity.sql
                    path: models/marts/fact_capacity.sql
                  - key: dim_department.sql
                    path: models/marts/dim_department.sql
                  - key: dim_time.sql
                    path: models/marts/dim_time.sql
                  - key: dict_metrics.sql
                    path: models/dictionary/dict_metrics.sql
                  - key: revenue_cycle_schema.yml
                    path: models/revenue_cycle/schema.yml
                  - key: stg_rcm_claims.sql
                    path: models/revenue_cycle/staging/stg_rcm_claims.sql
                  - key: stg_rcm_financial_postings.sql
                    path: models/revenue_cycle/staging/stg_rcm_financial_postings.sql
                  - key: stg_rcm_referrals.sql
                    path: models/revenue_cycle/staging/stg_rcm_referrals.sql
                  - key: fct_revenue_cycle.sql
                    path: models/revenue_cycle/marts/fct_revenue_cycle.sql
                  - key: fct_financial_posting.sql
                    path: models/revenue_cycle/marts/fct_financial_posting.sql
                  - key: fct_claim_aging.sql
                    path: models/revenue_cycle/marts/fct_claim_aging.sql
                  - key: fct_denials.sql
                    path: models/revenue_cycle/marts/fct_denials.sql
                  - key: fct_revenue_leakage.sql
                    path: models/revenue_cycle/marts/fct_revenue_leakage.sql
                  - key: fct_payer_performance.sql
                    path: models/revenue_cycle/marts/fct_payer_performance.sql
                  - key: fct_patient_acquisition.sql
                    path: models/revenue_cycle/marts/fct_patient_acquisition.sql
                  - key: fct_cash_recovery_opportunity.sql
                    path: models/revenue_cycle/marts/fct_cash_recovery_opportunity.sql
                  - key: fct_cash_forecast.sql
                    path: models/revenue_cycle/marts/fct_cash_forecast.sql
                  - key: fct_payer_contract_performance.sql
                    path: models/revenue_cycle/marts/fct_payer_contract_performance.sql
                  - key: fct_team_recovery_performance.sql
                    path: models/revenue_cycle/marts/fct_team_recovery_performance.sql
                  - key: revenue_cycle_gl_reconciliation.sql
                    path: tests/revenue_cycle_gl_reconciliation.sql
                  - key: talemia_schema.yml
                    path: models/talemia/schema.yml
                  - key: stg_talemia_opportunities.sql
                    path: models/talemia/staging/stg_talemia_opportunities.sql
                  - key: stg_talemia_awards.sql
                    path: models/talemia/staging/stg_talemia_awards.sql
                  - key: stg_talemia_losses.sql
                    path: models/talemia/staging/stg_talemia_losses.sql
                  - key: stg_talemia_updates.sql
                    path: models/talemia/staging/stg_talemia_updates.sql
                  - key: stg_talemia_dimensions.sql
                    path: models/talemia/staging/stg_talemia_dimensions.sql
                  - key: stg_talemia_dashboard_targets.sql
                    path: models/talemia/staging/stg_talemia_dashboard_targets.sql
                  - key: fct_talemia_opportunity.sql
                    path: models/talemia/marts/fct_talemia_opportunity.sql
                  - key: fct_talemia_pipeline.sql
                    path: models/talemia/marts/fct_talemia_pipeline.sql
                  - key: fct_talemia_win_loss.sql
                    path: models/talemia/marts/fct_talemia_win_loss.sql
                  - key: fct_talemia_account_manager_performance.sql
                    path: models/talemia/marts/fct_talemia_account_manager_performance.sql
                  - key: fct_talemia_business_line_performance.sql
                    path: models/talemia/marts/fct_talemia_business_line_performance.sql
                  - key: fct_talemia_opportunity_updates.sql
                    path: models/talemia/marts/fct_talemia_opportunity_updates.sql
                  - key: fct_talemia_kpi_performance.sql
                    path: models/talemia/marts/fct_talemia_kpi_performance.sql
                  - key: fct_talemia_stage_distribution.sql
                    path: models/talemia/marts/fct_talemia_stage_distribution.sql
                  - key: fct_talemia_pipeline_risk.sql
                    path: models/talemia/marts/fct_talemia_pipeline_risk.sql
                  - key: fct_talemia_client_cohort.sql
                    path: models/talemia/marts/fct_talemia_client_cohort.sql
                  - key: fct_talemia_sales_cycle.sql
                    path: models/talemia/marts/fct_talemia_sales_cycle.sql
                  - key: fct_talemia_pipeline_forecast.sql
                    path: models/talemia/marts/fct_talemia_pipeline_forecast.sql
                  - key: fct_talemia_sales_growth.sql
                    path: models/talemia/marts/fct_talemia_sales_growth.sql
                  - key: fct_talemia_dashboard_reconciliation.sql
                    path: models/talemia/marts/fct_talemia_dashboard_reconciliation.sql
                  - key: fct_talemia_extraction_quality.sql
                    path: models/talemia/marts/fct_talemia_extraction_quality.sql
                  - key: dict_talemia_metrics.sql
                    path: models/talemia/dictionary/dict_talemia_metrics.sql
                  - key: dict_talemia_terms.sql
                    path: models/talemia/dictionary/dict_talemia_terms.sql
            - name: dbt-workspace
              emptyDir: {}
            - name: dbt-profile
              configMap:
                name: dbt-profile-template
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbt-project-files
  namespace: opencare
data:
  dbt_project.yml: |
    name: opencare
    version: 0.1.0
    config-version: 2

    profile: opencare

    model-paths:
      - models
    macro-paths:
      - macros

    target-path: target
    clean-targets:
      - target
      - dbt_packages

    models:
      opencare:
        +materialized: view
        staging:
          +materialized: view
          +schema: staging
        marts:
          +materialized: table
          +schema: analytics
        dictionary:
          +materialized: table
          +schema: dictionary
  generate_schema_name.sql: |
    {% macro generate_schema_name(custom_schema_name, node) -%}
        {%- if custom_schema_name is none -%}
            {{ target.schema }}
        {%- else -%}
            {{ custom_schema_name | trim }}
        {%- endif -%}
    {%- endmacro %}
  sources.yml: |
    version: 2

    sources:
      - name: raw
        description: Operational landing schema populated by Airbyte from the external hospital MySQL source.
        schema: "{{ env_var('DBT_SOURCE_SCHEMA', env_var('RAW_SCHEMA', 'raw')) }}"
        tables:
          - name: wards
            description: Raw ward reference records from the source system.
            columns:
              - name: ward_id
                tests:
                  - not_null
              - name: ward_code
                tests:
                  - not_null
              - name: ward_name
                tests:
                  - not_null
          - name: patients
            description: Raw patient reference records from the source system.
            columns:
              - name: patient_id
                tests:
                  - not_null
              - name: medical_record_number
                tests:
                  - not_null
          - name: bed_events
            description: Raw ward occupancy and movement events from the source system.
            columns:
              - name: event_id
                tests:
                  - not_null
              - name: event_timestamp
                tests:
                  - not_null
              - name: ward_id
                tests:
                  - not_null
              - name: event_type
                tests:
                  - not_null
  schema.yml: |
    version: 2

    models:
      - name: stg_wards
        description: Standardized ward dimension inputs shaped from Airbyte-loaded raw ward records.
        columns:
          - name: ward_id
            tests:
              - not_null
              - unique
          - name: ward_code
            tests:
              - not_null
              - unique
          - name: ward_name
            tests:
              - not_null

      - name: stg_patients
        description: Standardized patient reference inputs for downstream healthcare analytics use cases.
        columns:
          - name: patient_id
            tests:
              - not_null
              - unique
          - name: medical_record_number
            tests:
              - not_null
              - unique

      - name: stg_bed_events
        description: Standardized bed occupancy and movement event records.
        columns:
          - name: bed_event_key
            tests:
              - not_null
              - unique
          - name: ward_id
            tests:
              - not_null
              - relationships:
                  to: ref('stg_wards')
                  field: ward_id
          - name: patient_id
            tests:
              - relationships:
                  to: ref('stg_patients')
                  field: patient_id
                  where: "patient_id is not null"
          - name: event_type
            tests:
              - not_null
              - accepted_values:
                  values: ['midnight_census', 'admission', 'discharge', 'transfer_in', 'transfer_out']
          - name: event_date
            tests:
              - not_null
          - name: occupied_beds
            tests:
              - not_null

      - name: stg_departments
        description: Compatibility staging model that maps wards onto the legacy department shape.
        columns:
          - name: department_id
            tests:
              - not_null
              - unique
          - name: department_code
            tests:
              - not_null
              - unique
          - name: department_name
            tests:
              - not_null

      - name: dim_ward
        description: Analytics ward dimension for operational reporting and runtime joins.
        columns:
          - name: ward_id
            tests:
              - not_null
              - unique
          - name: ward_code
            tests:
              - not_null
              - unique
          - name: ward_name
            tests:
              - not_null

      - name: dim_date
        description: Analytics date dimension derived from the bed occupancy event calendar.
        columns:
          - name: date_day
            tests:
              - not_null
              - unique

      - name: fct_bed_occupancy
        description: Daily ward-level occupancy fact used by forecasting and anomaly detection.
        columns:
          - name: occupancy_fact_key
            tests:
              - not_null
              - unique
          - name: date_day
            tests:
              - not_null
          - name: ward_id
            tests:
              - not_null
              - relationships:
                  to: ref('dim_ward')
                  field: ward_id
          - name: occupancy_rate
            tests:
              - not_null

      - name: fact_capacity
        description: Daily ward capacity fact retained for runtime compatibility and capacity KPI calculations.
        columns:
          - name: capacity_fact_key
            tests:
              - not_null
              - unique
          - name: department_id
            tests:
              - not_null

      - name: dim_department
        description: Compatibility alias for runtime consumers that still read analytics.dim_department.
        columns:
          - name: department_id
            tests:
              - not_null
              - unique

      - name: dim_time
        description: Compatibility alias for runtime consumers that still read analytics.dim_time.
        columns:
          - name: date_day
            tests:
              - not_null
              - unique
      - name: dict_metrics
        description: Dictionary metrics reference for the Hospital Bed Occupancy Intelligence demo.
        columns:
          - name: metric_id
            tests:
              - not_null
              - unique
          - name: metric_name
            tests:
              - not_null
          - name: metric_schema
            tests:
              - not_null
  stg_bed_events.sql: |
    with source_data as (
        select
            cast(event_id as text) as bed_event_key,
            cast(event_timestamp as timestamp) as event_timestamp,
            cast(event_timestamp as date) as event_date,
            cast(ward_id as text) as ward_id,
            nullif(trim(cast(patient_id as text)), '') as patient_id,
            lower(trim(cast(event_type as text))) as event_type,
            cast(occupied_beds as integer) as occupied_beds,
            cast(licensed_beds as integer) as licensed_beds,
            cast(staffed_beds as integer) as staffed_beds,
            nullif(trim(cast(scenario_tag as text)), '') as scenario_tag,
            row_number() over (
                partition by cast(event_id as text)
                order by
                    cast(event_timestamp as timestamp) desc,
                    coalesce(nullif(trim(cast(scenario_tag as text)), ''), '') desc,
                    cast(occupied_beds as integer) desc nulls last,
                    cast(staffed_beds as integer) desc nulls last
            ) as dedupe_rank
        from {{ source('raw', 'bed_events') }}
    )

    select
        bed_event_key,
        event_timestamp,
        event_date,
        ward_id,
        patient_id,
        event_type,
        occupied_beds,
        licensed_beds,
        staffed_beds,
        scenario_tag,
        case
            when staffed_beds is null or staffed_beds = 0 then null
            else round(occupied_beds::numeric / staffed_beds::numeric, 4)
        end as occupancy_rate
    from source_data
    where dedupe_rank = 1
  stg_wards.sql: |
    with source_data as (
        select distinct
            cast(ward_id as text) as ward_id,
            trim(cast(ward_code as text)) as ward_code,
            trim(cast(ward_name as text)) as ward_name,
            trim(cast(service_line as text)) as service_line,
            cast(licensed_beds as integer) as licensed_beds,
            cast(staffed_beds_baseline as integer) as staffed_beds_baseline
        from {{ source('raw', 'wards') }}
    )

    select
        ward_id,
        ward_code,
        ward_name,
        service_line,
        licensed_beds,
        staffed_beds_baseline
    from source_data
  stg_patients.sql: |
    with source_data as (
        select distinct
            cast(patient_id as text) as patient_id,
            trim(cast(medical_record_number as text)) as medical_record_number,
            cast(date_of_birth as date) as date_of_birth,
            upper(trim(cast(sex_at_birth as text))) as sex_at_birth,
            trim(cast(home_postcode as text)) as home_postcode
        from {{ source('raw', 'patients') }}
    )

    select
        patient_id,
        medical_record_number,
        date_of_birth,
        sex_at_birth,
        home_postcode
    from source_data
  stg_departments.sql: |
    select
        ward_id as department_id,
        ward_code as department_code,
        ward_name as department_name,
        service_line
    from {{ ref('stg_wards') }}
  dim_ward.sql: |
    select
        ward_id,
        ward_code,
        ward_name,
        service_line,
        licensed_beds,
        staffed_beds_baseline
    from {{ ref('stg_wards') }}
  dim_date.sql: |
    with distinct_dates as (
        select distinct
            event_date as date_day
        from {{ ref('stg_bed_events') }}
        where event_type = 'midnight_census'
          and event_date is not null
    )

    select
        date_day,
        extract(isodow from date_day) as day_of_week,
        extract(week from date_day) as week_of_year,
        extract(month from date_day) as month_of_year,
        extract(quarter from date_day) as quarter_of_year,
        extract(year from date_day) as year_number
    from distinct_dates
  fct_bed_occupancy.sql: |
    with census_events as (
        select
            event_date as date_day,
            ward_id,
            max(occupied_beds) as occupied_beds,
            max(licensed_beds) as licensed_beds,
            max(staffed_beds) as staffed_beds,
            max(occupancy_rate) as occupancy_rate
        from {{ ref('stg_bed_events') }}
        where event_type = 'midnight_census'
        group by 1, 2
    )

    select
        md5(concat(date_day::text, '||', ward_id)) as occupancy_fact_key,
        date_day,
        ward_id,
        occupied_beds,
        licensed_beds,
        staffed_beds,
        greatest(staffed_beds - occupied_beds, 0) as available_beds,
        occupancy_rate,
        case
            when occupancy_rate >= 0.9 then true
            else false
        end as pressure_flag
    from census_events
  fct_bed_pressure_daily_summary.sql: |
    with daily_flow as (
        select
            event_date as date_day,
            count(*) filter (where event_type = 'admission') as admissions_total,
            count(*) filter (where event_type = 'discharge') as discharges_total
        from {{ ref('stg_bed_events') }}
        group by 1
    ),

    daily_pressure as (
        select
            date_day,
            sum(occupied_beds) as network_occupied_beds,
            sum(staffed_beds) as network_staffed_beds,
            sum(available_beds) as network_available_beds,
            round(
                case
                    when sum(staffed_beds) = 0 then 0
                    else sum(occupied_beds)::numeric / sum(staffed_beds)::numeric * 100
                end,
                2
            ) as network_occupancy_rate_pct,
            round(avg(occupancy_rate) * 100, 2) as avg_ward_occupancy_pct,
            round(max(occupancy_rate) * 100, 2) as peak_ward_occupancy_pct,
            count(*) filter (where occupancy_rate >= 0.90) as critical_ward_count,
            count(*) filter (where occupancy_rate >= 0.75 and occupancy_rate < 0.90) as warning_ward_count,
            count(*) filter (where occupancy_rate < 0.75) as normal_ward_count,
            count(*) as ward_count
        from {{ ref('fct_bed_occupancy') }}
        group by 1
    )

    select
        md5(pressure.date_day::text) as pressure_daily_summary_key,
        pressure.date_day,
        pressure.network_occupied_beds,
        pressure.network_staffed_beds,
        pressure.network_available_beds,
        pressure.network_occupancy_rate_pct,
        pressure.avg_ward_occupancy_pct,
        pressure.peak_ward_occupancy_pct,
        pressure.critical_ward_count,
        pressure.warning_ward_count,
        pressure.normal_ward_count,
        pressure.ward_count,
        coalesce(flow.admissions_total, 0) as admissions_total,
        coalesce(flow.discharges_total, 0) as discharges_total,
        coalesce(flow.admissions_total, 0) - coalesce(flow.discharges_total, 0) as net_flow
    from daily_pressure as pressure
    left join daily_flow as flow
        on pressure.date_day = flow.date_day
  fct_bed_pressure_latest_summary.sql: |
    with latest_day as (
        select max(date_day) as date_day
        from {{ ref('fct_bed_pressure_daily_summary') }}
    )

    select
        pressure_daily_summary_key as latest_summary_key,
        date_day,
        network_occupied_beds,
        network_staffed_beds,
        network_available_beds,
        network_occupancy_rate_pct,
        avg_ward_occupancy_pct,
        peak_ward_occupancy_pct,
        critical_ward_count,
        warning_ward_count,
        normal_ward_count,
        ward_count,
        admissions_total,
        discharges_total,
        net_flow
    from {{ ref('fct_bed_pressure_daily_summary') }}
    where date_day = (select date_day from latest_day)
  fct_bed_pressure_latest_snapshot.sql: |
    with latest_day as (
        select max(date_day) as date_day
        from {{ ref('fct_bed_occupancy') }}
    ),

    latest_flow as (
        select
            ward_id,
            count(*) filter (where event_type = 'admission') as admissions_today,
            count(*) filter (where event_type = 'discharge') as discharges_today
        from {{ ref('stg_bed_events') }}
        where event_date = (select date_day from latest_day)
        group by 1
    )

    select
        md5(concat(occupancy.date_day::text, '||', occupancy.ward_id, '||latest')) as latest_snapshot_key,
        occupancy.date_day,
        occupancy.ward_id,
        ward.ward_code,
        ward.ward_name,
        occupancy.occupied_beds,
        occupancy.staffed_beds,
        occupancy.available_beds,
        round(occupancy.occupancy_rate * 100, 2) as occupancy_rate_pct,
        coalesce(flow.admissions_today, 0) as admissions_today,
        coalesce(flow.discharges_today, 0) as discharges_today,
        coalesce(flow.admissions_today, 0) - coalesce(flow.discharges_today, 0) as net_flow,
        case
            when occupancy.occupancy_rate >= 0.90 then 'Critical'
            when occupancy.occupancy_rate >= 0.75 then 'Warning'
            else 'Normal'
        end as pressure_band
    from {{ ref('fct_bed_occupancy') }} as occupancy
    join latest_day
        on occupancy.date_day = latest_day.date_day
    join {{ ref('dim_ward') }} as ward
        on occupancy.ward_id = ward.ward_id
    left join latest_flow as flow
        on occupancy.ward_id = flow.ward_id
  fact_bed_occupancy.sql: |
    select
        occupancy_fact_key,
        date_day,
        ward_id as department_id,
        occupied_beds,
        staffed_beds,
        occupancy_rate,
        available_beds,
        pressure_flag
    from {{ ref('fct_bed_occupancy') }}
  fact_capacity.sql: |
    with daily_capacity as (
        select
            event_date as date_day,
            ward_id,
            max(licensed_beds) as licensed_beds,
            max(staffed_beds) as staffed_beds
        from {{ ref('stg_bed_events') }}
        where event_type = 'midnight_census'
        group by 1, 2
    )

    select
        md5(concat(date_day::text, '||', ward_id)) as capacity_fact_key,
        date_day,
        ward_id as department_id,
        licensed_beds,
        staffed_beds
    from daily_capacity
  dim_department.sql: |
    select
        ward_id as department_id,
        ward_code as department_code,
        ward_name as department_name,
        service_line
    from {{ ref('dim_ward') }}
  dim_time.sql: |
    select
        date_day,
        extract(isodow from date_day) as day_of_week,
        extract(week from date_day) as week_of_year,
        extract(month from date_day) as month_of_year,
        extract(quarter from date_day) as quarter_of_year,
        extract(year from date_day) as year_number
    from {{ ref('dim_date') }}
  dict_metrics.sql: |
    select
        'occupied_beds' as metric_id,
        'Occupied Beds' as metric_name,
        'Daily occupied bed count captured from the midnight census event.' as metric_description,
        'analytics.fct_bed_occupancy' as metric_schema
    union all
    select
        'available_beds' as metric_id,
        'Available Beds' as metric_name,
        'Remaining staffed beds available after subtracting the midnight census occupied beds.' as metric_description,
        'analytics.fct_bed_occupancy' as metric_schema
    union all
    select
        'occupancy_rate' as metric_id,
        'Occupancy Rate' as metric_name,
        'Ratio of occupied beds to staffed beds for a ward-day.' as metric_description,
        'analytics.fct_bed_occupancy' as metric_schema
    union all
    select
        'pressure_flag' as metric_id,
        'Pressure Flag' as metric_name,
        'Boolean flag indicating that ward occupancy reached or exceeded 90 percent of staffed beds.' as metric_description,
        'analytics.fct_bed_occupancy' as metric_schema
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbt-profile-template
  namespace: opencare
data:
  profiles.yml: |
    opencare:
      target: dev
      outputs:
        dev:
          type: postgres
          host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
          port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
          user: "{{ env_var('POSTGRES_USER', 'opencare') }}"
          password: "{{ env_var('POSTGRES_PASSWORD', '') }}"
          dbname: "{{ env_var('POSTGRES_DB', 'opencare') }}"
          schema: analytics
          threads: 4
          keepalives_idle: 0
          connect_timeout: 10
          search_path: analytics,public
          sslmode: prefer
