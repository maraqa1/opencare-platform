---
apiVersion: batch/v1
kind: Job
metadata:
  name: local-ai-model-warm
  namespace: opencare
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: warm-model
          image: curlimages/curl:8.10.1
          envFrom:
            - configMapRef:
                name: opencare-config
          command:
            - sh
            - -c
            - |
              set -eu
              model="${LOCAL_AI_MODEL:-llama3.1:8b}"
              keep_alive="${LOCAL_AI_KEEP_ALIVE:-24h}"
              max_seconds="${LOCAL_AI_WARM_MAX_SECONDS:-600}"
              echo "Warming local AI model: ${model} with keep_alive=${keep_alive}"
              curl --fail --show-error --silent --max-time "${max_seconds}" \
                http://ollama:11434/api/generate \
                -H 'Content-Type: application/json' \
                -d "{\"model\":\"${model}\",\"prompt\":\"warm\",\"stream\":false,\"keep_alive\":\"${keep_alive}\"}"
              echo
