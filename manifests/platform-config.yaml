---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencare-config
  namespace: opencare
data:
  APP_ENV: production
  APP_NAME: opencare-backend
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  ANALYTICS_SCHEMA: analytics
  RAW_SCHEMA: raw
  STAGING_SCHEMA: staging
  DICTIONARY_SCHEMA: dictionary
  OUTPUT_SCHEMA: output
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: opencare
  POSTGRES_USER: opencare
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: minio.opencare.svc.cluster.local:9000
  MINIO_REGION: us-east-1
  MINIO_BUCKET: reports
  MINIO_BUCKET_RAW: opencare-raw
  MINIO_BUCKET_STATE: opencare-state
  AIRBYTE_BUCKET_LOG: opencare-airbyte-log
  AIRBYTE_BUCKET_STATE: opencare-state
  AIRBYTE_BUCKET_WORKLOAD_OUTPUT: opencare-airbyte-workload-output
  AIRBYTE_BUCKET_ACTIVITY_PAYLOAD: opencare-airbyte-activity-payload
  AIRBYTE_BUCKET_AUDIT_LOGGING: opencare-airbyte-audit-logging
  AIRBYTE_BUCKET_PROFILER_OUTPUT: opencare-airbyte-profiler-output
  AIRBYTE_ENTERPRISE_SOURCE_STUBS_URL: https://connectors.airbyte.com/files/registries/v0/oss_registry.json
  AIRBYTE_ENTERPRISE_DESTINATION_STUBS_URL: https://connectors.airbyte.com/files/registries/v0/oss_registry.json
  AIRBYTE_CONNECTOR_REGISTRY_ENTERPRISE_ENABLED: "false"
  AIRBYTE_SQL_TLS_ENABLED: "false"
  AIRBYTE_POSTGRES_TLS_ENABLED: "false"
  AIRBYTE_DEPLOYMENT_TIMEOUT_SECONDS: "1200"
  RUN_DATABASE_MIGRATION_ON_STARTUP: "true"
  CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: 0.40.23.002
  JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: 0.40.26.001
  AIRBYTE_FLYWAY_CONFIGS_MINIMUM_MIGRATION_VERSION: 0.40.23.002
  AIRBYTE_FLYWAY_JOBS_MINIMUM_MIGRATION_VERSION: 0.40.26.001
  AIRBYTE_SERVER_SERVICE_NAME: airbyte-airbyte-server-svc
  AIRBYTE_WEBAPP_SERVICE_NAME: airbyte-airbyte-webapp-svc
  AIRBYTE_TEMPORAL_FRONTEND_SERVICE_NAME: airbyte-temporal
  AIRBYTE_S3_PATH_STYLE: "true"
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: opencare
  FORECAST_RUNTIME_URL: http://bed-forecast:8000
  ANOMALY_RUNTIME_URL: http://anomaly:8000
  SUPERSET_EMBED_URL: http://superset:8088
  AIRBYTE_URL: http://airbyte-airbyte-server-svc:8001
  REPORTS_PREFIX: reports
  DICTIONARY_VERSION: "2026.04"
  RUNTIME_WRITES_ENABLED: "true"
  NEXT_PUBLIC_API_BASE_URL: http://backend:8000
  BACKEND_URL: http://backend:8000
  PORTAL_URL: http://portal:3000
  FORECAST_OUTPUT_TABLE: forecast_bed_occupancy
  ANOMALY_OUTPUT_TABLE: anomaly_bed_occupancy
  KEYCLOAK_ADMIN: admin
  KC_DB: postgres
  KC_DB_URL_HOST: postgres
  KC_DB_URL_PORT: "5432"
  KC_DB_URL_DATABASE: opencare
  KC_DB_USERNAME: opencare
  SUPERSET_SECRET_KEY: change-me-superset
  SUPERSET_LOAD_EXAMPLES: "no"
---
apiVersion: v1
kind: Secret
metadata:
  name: opencare-secrets
  namespace: opencare
type: Opaque
stringData:
  POSTGRES_PASSWORD: opencare
  KC_DB_PASSWORD: opencare
  MINIO_ROOT_USER: opencare
  MINIO_ROOT_PASSWORD: opencare123
  MINIO_ACCESS_KEY: opencare
  MINIO_SECRET_KEY: opencare123
  INTERNAL_API_TOKEN: opencare-internal-token
  KEYCLOAK_ADMIN_PASSWORD: opencare123
