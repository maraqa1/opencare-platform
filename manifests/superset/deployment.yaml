---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: opencare
spec:
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: opencare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
        - name: superset
          image: apache/superset:4.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
              name: http
          envFrom:
            - configMapRef:
                name: opencare-config
            - secretRef:
                name: opencare-secrets
          env:
            - name: SUPERSET_PORT
              value: "8088"
            - name: SUPERSET_DATABASE_URI
              value: >-
                postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?options=-csearch_path%3Danalytics,public
            - name: SUPERSET_CONFIG_PATH
              value: /app/pythonpath/superset_config.py
            - name: PYTHONPATH
              value: /app/pythonpath
            - name: SUPERSET_READONLY_USER
              value: $(SUPERSET_READONLY_USER)
            - name: SUPERSET_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: SUPERSET_READONLY_PASSWORD
                  optional: true
            - name: SUPERSET_ADMIN_USER
              value: $(SUPERSET_ADMIN_USER)
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencare-secrets
                  key: SUPERSET_ADMIN_PASSWORD
                  optional: true
          volumeMounts:
            - name: superset-assets
              mountPath: /app/pythonpath
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: superset-assets
          configMap:
            name: superset-assets
