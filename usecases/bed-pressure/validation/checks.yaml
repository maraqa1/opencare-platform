checks:
  - id: required_roots_exist
    type: file_tree
    required_roots:
      - manifest
      - business
      - data
      - dbt
      - runtime
      - decisions
      - decision-workflows
      - screens
      - bindings
      - governance
      - acceptance
      - validation
      - schemas
      - assets/i18n
      - demo-data
      - docs
  - id: screen_routes_bound
    type: route_binding
    file: screens/screen_catalog.yaml
  - id: decision_lifecycle_declared
    type: decision_contract
    file: decision-workflows/action_lifecycle.yaml
  - id: governance_assets_declared
    type: governance_contract
    file: governance/assets.yaml
